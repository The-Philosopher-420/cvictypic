/* ---- Apple Health export.xml (po kúskoch) ---- */
async function importAppleXML(file,onp){
 const CH=6*1024*1024;let off=0,rest='';const steps={},rhr={},hrv={},mass={},kcal={},sleep={};
 const re=/<Record type="HK(?:Quantity|Category)TypeIdentifier(StepCount|RestingHeartRate|HeartRateVariabilitySDNN|BodyMass|ActiveEnergyBurned|SleepAnalysis)"([^>]*)\/?>/g;
 const attr=(s,n)=>{const m=s.match(new RegExp(n+'="([^"]*)"'));return m?m[1]:'';};
 while(off<file.size){
  const t=await file.slice(off,off+CH).text();off+=CH;let s=rest+t;const cut=s.lastIndexOf('<Record');if(cut>0&&off<file.size){rest=s.slice(cut);s=s.slice(0,cut);}else rest='';
  let m;re.lastIndex=0;
  while((m=re.exec(s))){const type=m[1],a=m[2];const sd=attr(a,'startDate').slice(0,10);if(!/^\d{4}-\d{2}-\d{2}$/.test(sd))continue;const val=attr(a,'value');
   if(type==='StepCount'){const src=attr(a,'sourceName');steps[sd]=steps[sd]||{};steps[sd][src]=(steps[sd][src]||0)+(+val||0);}
   else if(type==='RestingHeartRate'){(rhr[sd]=rhr[sd]||[]).push(+val);}
   else if(type==='HeartRateVariabilitySDNN'){(hrv[sd]=hrv[sd]||[]).push(+val);}
   else if(type==='BodyMass'){let w=+val;if(attr(a,'unit')==='lb')w*=.4536;mass[sd]=w;}
   else if(type==='ActiveEnergyBurned'){let k=+val;if(attr(a,'unit')==='kJ')k/=4.184;kcal[sd]=(kcal[sd]||0)+k;}
   else if(type==='SleepAnalysis'){if(!/Asleep/.test(val))continue;const ed=attr(a,'endDate');const a1=new Date(attr(a,'startDate').replace(' ','T').replace(/\s\+/,'+')),b1=new Date(ed.replace(' ','T').replace(/\s\+/,'+'));const mn=(b1-a1)/6e4;if(mn>0&&mn<1000){const day=ed.slice(0,10);sleep[day]=(sleep[day]||0)+mn;}}
  }
  if(onp)onp(Math.min(1,off/file.size));await new Promise(r=>setTimeout(r,0));
 }
 D.health=D.health||{};const fields=new Set();const daysSet=new Set();
 const put=(map,k,fn)=>Object.entries(map).forEach(([d,v])=>{const o=D.health[d]||{};o[k]=fn(v);D.health[d]=o;fields.add(k);daysSet.add(d);});
 put(steps,'steps',v=>Math.round(Math.max(...Object.values(v))));put(rhr,'rhr',v=>Math.round(v.reduce((a,b)=>a+b,0)/v.length));put(hrv,'hrv',v=>Math.round(v.reduce((a,b)=>a+b,0)/v.length));put(mass,'w',v=>r1(v));put(kcal,'kcal',v=>Math.round(v));put(sleep,'sleep',v=>Math.round(v));
 return {days:daysSet.size,fields:[...fields].map(k=>({steps:'kroky',rhr:'kľudový tep',hrv:'HRV',sleep:'spánok',kcal:'kalórie',w:'váha'}[k])),warn:daysSet.size?'':'V súbore som nenašiel žiadne záznamy – je to export.xml z appky Zdravie?'};
}

  messages:[{role:'user',content:`Tu sú jedlá z denníka jednej osoby (id, názov, zápis, položky):\n${meals.map(m=>`${m.id}|${m.name||''}|${(m.note||'').slice(0,120)}|${(m.items||[]).map(i=>i.n+' '+(i.g||'')+'g').join(', ')}`).join('\n')}\n\nUž existujúce recepty (nevytváraj duplikáty): ${existing.join('; ')}.\n\nZ jedál, ktoré sa opakujú alebo sú zložené z viac surovín, sprav recepty. Ak je to variant rovnakého typu (napr. jogurtový bowl s inými prísadami), daj rovnaké "grp" a odlíš názvom. Vráť IBA JSON pole (max 8): [{"t":"názov","cat":"raňajky|obed|večera|snack|sladké","grp":"skupina alebo prázdne","time":"15 min","s":"krátky podtitul","ing":["100 g ..."],"steps":["krok"],"serve":"tip","m":{"kcal":0,"p":0,"c":0,"f":0,"fi":0},"srcMeal":"id jedla, z ktorého recept vychádza"}]`}],max:2500});
 const arr=AI.json(out);if(!Array.isArray(arr))return 0;let n=0;
 arr.forEach(r=>{if(!r.t)return;const nt=norm(r.t);if(allRecipes().some(x=>norm(x.t)===nt))return;const src=(D.meals||[]).find(m=>m.id===r.srcMeal);D.recipes.push({id:'ai'+uid(),t:String(r.t).slice(0,60),s:String(r.s||'').slice(0,80),cat:RCATS.includes(r.cat)?r.cat:'obed',grp:String(r.grp||'').slice(0,40),time:String(r.time||'').slice(0,20),ing:(r.ing||[]).map(String),steps:(r.steps||[]).map(String),serve:String(r.serve||''),m:{kcal:+((r.m||{}).kcal)||0,p:+((r.m||{}).p)||0,c:+((r.m||{}).c)||0,f:+((r.m||{}).f)||0,fi:+((r.m||{}).fi)||0},img:src&&src.th?src.th:'',src:'ai',d:today()});n++;});
 D.ai.recipesMonth=month;return n;
}
/* ---------- AI sync (tlačidlo v každej karte + full) ---------- */
let SYNCING=false;
async function aiSync(scope='all',{status=()=>{},silent=false}={}){
 if(SYNCING)return;if(!AI.mode()){if(!silent)toast('AI nie je nastavená – nastavenia (avatar) → AI');return;}
 SYNCING=true;D.ai=D.ai||{};const errs=[];
 try{
  if(['all','food'].includes(scope)){status('analyzujem jedlá…');try{await analyzePending(t=>status('jedlá '+t));}catch(e){errs.push(e);}computeTopFoods();status('hľadám recepty…');try{const n=await aiRecipesFromDiary(scope==='food');if(n&&!silent)toast(`✦ ${n} nové recepty z denníka`);}catch(e){errs.push(e);}}
  if(scope==='shop'){computeTopFoods();}
  if(['all','home','train','health','shop'].includes(scope)){status('píšem kredo a hodnotenie…');try{await aiCredoAssess();}catch(e){errs.push(e);}}
  D.ai.lastSync=Date.now();save();
 }finally{SYNCING=false;}
 if(errs.length&&!silent)toast('Sync s chybou: '+(errs[0].message||errs[0]),3000);
}
async function aiAutoSync(){
 try{const srv=await S.get(K.aiSrv(ME.id));if(srv&&srv.credo&&(!D.ai.credo||srv.credo.d>D.ai.credo.d)){D.ai.credo=srv.credo;if(srv.assess)D.ai.assess=srv.assess;save();if(curTab==='home')renderHome();}}catch(e){}
 if(!AI.mode())return;if(D.ai&&D.ai.autoDay===today())return;
 D.ai=D.ai||{};D.ai.autoDay=today();save();
 try{await aiCredoAssess();const pend=(D.meals||[]).filter(m=>m.ai==='pending').length;if(pend)await analyzePending();D.ai.lastSync=Date.now();save();if(curTab==='home')renderHome();else if(curTab==='food')renderFood();}catch(e){}
}

/* =====================================================================
   CHAT
   ===================================================================== */
const CHAT={effort:'mid',hist:[],busy:false};
const EFFORT={light:'Odpovedaj veľmi stručne – maximálne 3 vety, žiadne odrážky.',mid:'Odpovedaj stručne a prakticky, do ~150 slov. Odrážky len keď naozaj pomôžu.',high:'Odpovedaj dôkladne, do ~300 slov, s konkrétnymi číslami a krokmi.',max:'Odpovedaj maximálne dôkladne: najprv krátko uvažuj o kontexte osoby, potom daj konkrétny plán s číslami a na konci uveď 1–3 zdroje (autor, rok, časopis) z PubMed.'};
function chatSystem(){return `Si Claude v appke „Cvič ty pič“ – tréningový a stravovací parťák. Hovoríš po slovensky, priateľsky, priamo, bez balastu. Nie si lekár – pri bolesti, zraneniach, liekoch a chorobách odporučíš lekára/fyzioterapeuta.\nPRAVIDLÁ: ${EFFORT[CHAT.effort]} Vychádzaj z kvalitných štúdií (meta-analýzy, RCT) a pri číslach povedz odkiaľ sú. Neodporúčaj zbytočné doplnky. Nič ostré/kyslé v receptoch.\n${APP_CTX}\n${profileCtx()}`;}
function renderMsgs(){const el=$('msgs');el.innerHTML=(CHAT.hist.length?CHAT.hist.map(m=>`<div class="msg ${m.role==='user'?'u':'a'}${m.err?' err':''}">${esc(m.content)}</div>`).join(''):`<div class="msg a">${AI.mode()?'Ahoj! Vidím tvoj profil, cieľ, program aj štatistiky. Opýtaj sa napr. „čo jesť po tréningu za pár eur“, „prečo ma bolia kríže po hip thruste“ alebo „ako zvýšiť lat pulldown“.':'AI tu nie je zapnutá, tak to spravíme inak: napíš otázku a otvorím tvoju Claude appku aj s celým kontextom (profil, plán, štatistiky). Odpoveď dostaneš tam, zadarmo v rámci tvojho účtu.'}</div>`)+(CHAT.busy?'<div class="typing">Claude píše…</div>':'');el.scrollTop=el.scrollHeight;}
$('fab').onclick=()=>{CHAT.hist=LS.get(K.chat(ME.id))||[];renderMsgs();openSheet('shChat');};
$('effort').addEventListener('seg',e=>{CHAT.effort=e.detail;});
$('cclear').onclick=()=>{CHAT.hist=[];LS.set(K.chat(ME.id),[]);renderMsgs();};
$('cinp').addEventListener('input',e=>{e.target.style.height='auto';e.target.style.height=Math.min(120,e.target.scrollHeight)+'px';});
$('cinp').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&window.innerWidth>700){e.preventDefault();sendChat();}});
$('csend').onclick=sendChat;
async function sendChat(){
 const q=$('cinp').value.trim();if(!q||CHAT.busy)return;
 $('cinp').value='';$('cinp').style.height='auto';
 CHAT.hist.push({role:'user',content:q});
 if(!AI.mode()){
  const prompt=`${chatSystem()}\n\nOTÁZKA: ${q}`;const url='https://claude.ai/new?q='+encodeURIComponent(prompt);
  try{await navigator.clipboard.writeText(prompt);}catch(e){}
  CHAT.hist.push({role:'assistant',content:'Otváram Claude s tvojou otázkou a celým kontextom (prompt je aj v schránke, keby sa neprelial). Odpoveď si prečítaš tam.'});renderMsgs();LS.set(K.chat(ME.id),CHAT.hist.slice(-40));
  window.open(url,'_blank');return;
 }
 CHAT.busy=true;renderMsgs();
 try{const msgs=CHAT.hist.filter(m=>!m.err).slice(-16).map(m=>({role:m.role,content:m.content}));const text=await AI.call({system:chatSystem(),messages:msgs,max:1000});CHAT.hist.push({role:'assistant',content:text||'(prázdna odpoveď)'});}
 catch(err){CHAT.hist.push({role:'assistant',err:true,content:'Chat zlyhal: '+(err.message||err)+'. Skontroluj AI v nastaveniach (avatar).'});}
 CHAT.busy=false;renderMsgs();LS.set(K.chat(ME.id),CHAT.hist.slice(-40));
}

/* =====================================================================
   MINIHRA · Matej beží (sticker ako hráč)
   ===================================================================== */
const G={on:false,raf:0,best:0};
let ACTX=null;function beep(f,d=.07,type='square',v=.05){try{ACTX=ACTX||new (window.AudioContext||window.webkitAudioContext)();const o=ACTX.createOscillator(),g=ACTX.createGain();o.type=type;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(ACTX.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,ACTX.currentTime+d);o.stop(ACTX.currentTime+d);}catch(e){}}
function openGame(){G.on=true;$('game').classList.add('on');$('gover').hidden=true;G.best=(D.game&&D.game.best)||0;G.img=$('sticker');startRun();}
$('gclose').onclick=()=>{G.on=false;cancelAnimationFrame(G.raf);$('game').classList.remove('on');};
function startRun(){
 const c=$('gc'),dpr=Math.min(2,devicePixelRatio||1);const W=innerWidth,H=innerHeight;c.width=W*dpr;c.height=H*dpr;c.style.width=W+'px';c.style.height=H+'px';
 const x=c.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);
 const gy=H*.76,px=W*.2;const SH=110,SW=Math.round(SH*131/320);
 const st={t:0,speed:330,vy:0,py:gy,ground:true,hold:false,obs:[],next:1.2,score:0,shakes:0,dead:false,dist:0,bgx:0,bob:0};
 $('gover').hidden=true;$('gsc').textContent='0';
 const jump=()=>{if(st.dead)return;if(st.ground){st.vy=-820;st.ground=false;st.hold=true;beep(620,.06);buzz(6);}};
 const release=()=>{st.hold=false;if(st.vy<-300)st.vy=-300;};
 c.onpointerdown=e=>{e.preventDefault();if(st.dead)return;jump();};c.onpointerup=release;c.onpointercancel=release;
 const key=e=>{if(!G.on)return;if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();if(e.type==='keydown'){if(!e.repeat)jump();}else release();}};
 window.onkeydown=key;window.onkeyup=key;
 const spawn=()=>{const r=Math.random();let o;if(r<.38)o={k:'db',w:46,h:24};else if(r<.66)o={k:'kb',w:34,h:40};else if(r<.8)o={k:'rack',w:22,h:64};else o={k:'shake',w:22,h:30,fly:120+Math.random()*60};o.x=W+40;st.obs.push(o);};
 let last=performance.now();
 const drawPlayer=()=>{const py=st.py;const bob=st.ground?Math.abs(Math.sin(st.bob))*4:0;const tilt=st.ground?0:-.12;x.save();x.translate(px,py-bob);x.rotate(tilt);if(G.img&&G.img.complete)x.drawImage(G.img,-SW/2,-SH,SW,SH);else{x.fillStyle='#5B8CFF';x.fillRect(-14,-SH,28,SH);}x.restore();x.fillStyle='rgba(0,0,0,.35)';x.beginPath();x.ellipse(px,gy+4,SW*.6,5,0,0,Math.PI*2);x.fill();};
 const drawObs=o=>{const y=gy;x.lineCap='round';if(o.k==='db'){x.fillStyle='#8B93A1';x.fillRect(o.x+14,y-14,o.w-28,6);x.fillStyle='#3C4652';[o.x+7,o.x+o.w-7].forEach(cx=>{x.beginPath();x.arc(cx,y-12,12,0,Math.PI*2);x.fill();x.strokeStyle='#5B8CFF';x.lineWidth=2;x.beginPath();x.arc(cx,y-12,6,0,Math.PI*2);x.stroke();});}
  else if(o.k==='kb'){x.fillStyle='#3C4652';x.beginPath();x.arc(o.x+17,y-17,17,0,Math.PI*2);x.fill();x.strokeStyle='#8B93A1';x.lineWidth=5;x.beginPath();x.arc(o.x+17,y-34,9,Math.PI,0);x.stroke();x.fillStyle='#FB7185';x.beginPath();x.arc(o.x+17,y-17,5,0,Math.PI*2);x.fill();}
  else if(o.k==='rack'){x.fillStyle='#3C4652';x.fillRect(o.x,y-o.h,o.w,o.h);x.fillStyle='#8B93A1';x.fillRect(o.x-12,y-o.h-6,o.w+24,6);x.fillStyle='#5B8CFF';[y-o.h+10,y-o.h+26,y-o.h+42].forEach(yy=>x.fillRect(o.x+4,yy,o.w-8,4));}
  else{const fy=y-o.fly+Math.sin(st.t*5)*4;x.fillStyle='#34D399';x.beginPath();if(x.roundRect)x.roundRect(o.x,fy-30,22,30,6);else x.rect(o.x,fy-30,22,30);x.fill();x.fillStyle='#F3F4F1';x.fillRect(o.x+6,fy-36,10,6);x.fillStyle='#06281B';x.font='900 9px system-ui';x.textAlign='center';x.fillText('PRO',o.x+11,fy-13);}};
 const loop=now=>{if(!G.on)return;const dt=Math.min(.033,(now-last)/1000);last=now;
  if(!st.dead){st.t+=dt;st.speed=Math.min(820,330+st.t*9);st.dist+=st.speed*dt;st.bob+=dt*st.speed/40;st.bgx=(st.bgx+st.speed*dt)%80;
   if(!st.ground){st.vy+=(st.hold&&st.vy<0?1500:2500)*dt;st.py+=st.vy*dt;if(st.py>=gy){st.py=gy;st.vy=0;st.ground=true;}}
   st.next-=dt;if(st.next<=0){spawn();st.next=(.8+Math.random()*.9)*(380/st.speed)+.3;}
   st.obs.forEach(o=>o.x-=st.speed*dt);st.obs=st.obs.filter(o=>o.x>-80);
   const pb={x:px-SW*.3,y:st.py-SH*.92,w:SW*.6,h:SH*.9};
   for(const o of st.obs){const ob=o.k==='shake'?{x:o.x,y:gy-o.fly-30,w:22,h:30}:{x:o.x+o.w*.12,y:gy-o.h*.9,w:o.w*.76,h:o.h*.9};
    if(pb.x<ob.x+ob.w&&pb.x+pb.w>ob.x&&pb.y<ob.y+ob.h&&pb.y+pb.h>ob.y){if(o.k==='shake'){if(!o.got){o.got=true;st.shakes++;beep(900,.08,'triangle');o.x=-999;}}else{st.dead=true;beep(140,.35,'sawtooth',.08);buzz([40,30,80]);setTimeout(()=>gameOver(st),350);}}}
   st.score=Math.floor(st.dist/12)+st.shakes*10;$('gsc').textContent=st.score;}
  x.fillStyle='#0E1114';x.fillRect(0,0,W,H);
  x.fillStyle='#12161B';x.fillRect(0,gy,W,H-gy);x.strokeStyle='#262D36';x.lineWidth=2;x.beginPath();x.moveTo(0,gy);x.lineTo(W,gy);x.stroke();
  x.fillStyle='#1F252C';for(let i=-1;i<W/80+1;i++)x.fillRect(i*80-st.bgx,gy+18,40,4);
  x.strokeStyle='#1A2028';x.lineWidth=6;for(let i=0;i<4;i++){const rx=((i*W/3-st.dist*.25)%(W+200)+W+200)%(W+200)-100;x.beginPath();x.moveTo(rx,gy);x.lineTo(rx,gy-H*.42);x.moveTo(rx-30,gy-H*.42);x.lineTo(rx+30,gy-H*.42);x.stroke();}
  st.obs.forEach(drawObs);drawPlayer();
  G.raf=requestAnimationFrame(loop);};
 G.raf=requestAnimationFrame(loop);
}
async function gameOver(st){
 D.game=D.game||{};if(st.score>(D.game.best||0)){D.game.best=st.score;save();}G.best=D.game.best;
 let lb=await S.get(K.game)||[];const mine=lb.find(e=>e.id===ME.id);
 if(mine){if(st.score>mine.score){mine.score=st.score;mine.d=today();}}else lb.push({id:ME.id,name:ME.name,score:st.score,d:today()});
 lb.sort((a,b)=>b.score-a.score);lb=lb.slice(0,10);await S.set(K.game,lb);
 const o=$('gover');o.hidden=false;
 o.innerHTML=`<img src="${$('sticker').src}" alt="" style="height:120px;filter:drop-shadow(0 10px 20px rgba(0,0,0,.6));transform:rotate(${st.score>=G.best&&st.score>0?'-6':'6'}deg)"><h2>${st.score>=G.best&&st.score>0?'Nový rekord! 🏆':'Matej spadol.'}</h2><div class="sc">${st.score}</div><div class="small mute">tvoj rekord ${G.best} · ${st.shakes} proteínov</div><div class="glb">${lb.slice(0,5).map((e,i)=>{const p=PROFILES.find(x=>x.id===e.id);return `<div><span>${['🥇','🥈','🥉'][i]||(i+1)+'.'} ${esc(p?p.name:e.name)}</span><b>${e.score}</b></div>`;}).join('')}</div><div class="row" style="gap:8px;margin-top:6px"><button class="btn pri" id="gagain">▶ Znova</button><button class="btn" id="gexit">Zavrieť</button></div><div class="tiny mute" style="margin-top:8px">ťuk = skok · podrž = vyšší skok · zbieraj proteíny</div>`;
 $('gagain').onclick=()=>startRun();$('gexit').onclick=()=>$('gclose').onclick();
}

/* =====================================================================
   ŠTART
   ===================================================================== */
(async function init(){
 loadServerConfig();idb=await idbOpen();
 const lb=LS.get(K.brand);if(lb)applyBrand(lb);
 PROFILES=LS.get(K.profiles)||[];renderLogin();
 if(SRV.url)pingServer().then(()=>renderLogin());
 let p=await S.get(K.profiles);
 if(Array.isArray(p)&&p.length)PROFILES=p;else if(!PROFILES.length){PROFILES=DEF_PROFILES.map(x=>Object.assign({created:today()},x));await saveProfiles();}
 PROFILES.forEach(pr=>{if(pr.goalText==null){const d=DEF_PROFILES.find(x=>x.id===pr.id);if(d){pr.goalText=d.goalText;if(!pr.bf)pr.bf=d.bf||0;if(!pr.bfT)pr.bfT=d.bfT||0;if(!pr.age)pr.age=d.age||0;if(!pr.sex)pr.sex=d.sex;}else pr.goalText='';}});
 renderLogin();
 const b=await S.get(K.brand);if(b)applyBrand(b);
 const me=LS.get(K.me);if(me&&PROFILES.find(x=>x.id===me))await login(me);
 if('serviceWorker' in navigator&&location.protocol==='https:'&&!window.storage){try{navigator.serviceWorker.register('sw.js').catch(()=>{});}catch(e){}}
 setInterval(async()=>{if(ME&&curTab==='home'&&S.mode!=='local'){await loadOthers();renderLB();}},60000);
 document.addEventListener('visibilitychange',async()=>{if(document.visibilityState==='visible'&&ME){const np=await S.get(K.profiles);if(Array.isArray(np)&&np.length){PROFILES=np;const m=PROFILES.find(x=>x.id===ME.id);if(m)ME=m;}if(curTab==='home'){await loadOthers();renderLB();}aiAutoSync();}});
})();
