<style>
:root{
  --bg:#0E1114;--bg2:#12161B;--card:#181D23;--card2:#1F252C;--line:#262D36;--line2:#323A45;
  --ink:#F3F4F1;--mute:#8B93A1;--dim:#5C6470;
  --blue:#5B8CFF;--blue-s:rgba(91,140,255,.16);
  --mint:#34D399;--mint-s:rgba(52,211,153,.16);
  --rose:#FB7185;--rose-s:rgba(251,113,133,.16);
  --amber:#FFB547;--amber-s:rgba(255,181,71,.16);
  --violet:#A78BFA;--violet-s:rgba(167,139,250,.16);
  --r:18px;--r2:12px;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --disp:'Unbounded',system-ui,sans-serif;--hand:'Caveat',cursive;--mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15.5px;line-height:1.45;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
h1,h2,h3,.disp{font-family:var(--disp);letter-spacing:-.01em;margin:0}
h2{font-size:17px;font-weight:700}
h3{font-size:14.5px;font-weight:700}
button{font-family:inherit;color:inherit}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink);background:var(--bg2);border:1px solid var(--line2);border-radius:var(--r2);padding:11px 12px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue);outline-offset:1px}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
[hidden]{display:none!important}
a{color:var(--blue)}
.mute{color:var(--mute)}.small{font-size:13px}.tiny{font-size:11.5px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.wrap{flex-wrap:wrap}
.center{text-align:center}
.mt{margin-top:12px}.mb{margin-bottom:12px}

/* ===== screens ===== */
.screen{min-height:100%;display:flex;flex-direction:column}
#app{height:100%;height:100dvh}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 14px calc(96px + var(--sab));max-width:720px;width:100%;margin:0 auto}
header.top{position:sticky;top:0;z-index:20;padding:calc(10px + var(--sat)) 14px 10px;background:rgba(14,17,20,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top .in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:10px}
.ava{width:40px;height:40px;border-radius:50%;object-fit:cover;background:var(--card2);display:flex;align-items:center;justify-content:center;font:700 14px var(--disp);color:var(--ink);border:2px solid var(--line2);flex:0 0 auto;overflow:hidden}
.ava img{width:100%;height:100%;object-fit:cover}
.ava.big{width:84px;height:84px;font-size:26px}
.brand{font:900 15px var(--disp);letter-spacing:.04em}
.brand em{font-style:normal;color:var(--blue)}
.hname{font-weight:700;font-size:14px;line-height:1.1}
.streak{display:flex;align-items:center;gap:5px;background:var(--amber-s);color:var(--amber);border-radius:999px;padding:6px 11px;font:700 13px var(--disp);border:1px solid rgba(255,181,71,.3)}

/* ===== tabbar ===== */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(18,22,27,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px 6px calc(6px + var(--sab));display:flex;justify-content:space-around;max-width:720px;margin:0 auto}
.tabbar button{flex:1;background:none;border:0;padding:6px 2px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--dim);font:600 10.5px system-ui;border-radius:12px;min-height:50px}
.tabbar button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabbar button[aria-selected="true"]{color:var(--ink)}
.tabbar button[aria-selected="true"] svg{stroke:var(--blue)}
.tabbar button:active{transform:scale(.94)}

/* ===== cards & buttons ===== */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card.flat{background:var(--bg2)}
.card h2{margin-bottom:8px}
.eyebrow{font:700 11px var(--disp);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin-bottom:6px}
.btn{border:1.5px solid var(--line2);background:var(--card2);color:var(--ink);border-radius:999px;padding:11px 16px;font:700 14px system-ui;cursor:pointer;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap}
.btn:active{transform:translateY(1px) scale(.98)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#0B1220}
.btn.mint{background:var(--mint);border-color:var(--mint);color:#06281B}
.btn.danger{border-color:var(--rose);color:var(--rose);background:transparent}
.btn.ghost{background:transparent}
.btn.sm{padding:7px 12px;min-height:36px;font-size:13px}
.btn.wide{width:100%}
.btn:disabled{opacity:.5}
.seg{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:none;color:var(--mute);border-radius:999px;padding:8px 4px;font:700 12.5px system-ui;min-height:36px}
.seg button[aria-pressed="true"]{background:var(--card2);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.4)}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line2);border-radius:999px;padding:4px 10px;font:600 12px system-ui;color:var(--mute);background:var(--bg2)}
.chip.love{border-color:rgba(251,113,133,.5);color:var(--rose);background:var(--rose-s)}
.chip.tier{border-color:rgba(255,181,71,.5);color:var(--amber);background:var(--amber-s);font-family:var(--disp);font-size:10.5px;font-weight:900}
.chip.ok{border-color:rgba(91,140,255,.4);color:var(--blue);background:var(--blue-s)}
.chip.dia{border-color:rgba(167,139,250,.5);color:var(--violet);background:var(--violet-s)}
.badge{font:700 10px var(--disp);letter-spacing:.06em;padding:3px 7px;border-radius:6px;text-transform:uppercase}
.lbl{display:block;font:600 12.5px system-ui;color:var(--mute);margin:10px 0 5px}
.fieldrow{display:flex;gap:8px}
.fieldrow>*{flex:1;min-width:0}
.toast{position:fixed;left:50%;bottom:calc(84px + var(--sab));transform:translateX(-50%) translateY(20px);background:var(--ink);color:#0E1114;padding:10px 16px;border-radius:999px;font:700 13.5px system-ui;opacity:0;transition:.25s;z-index:80;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.banner{background:var(--amber-s);border:1px solid rgba(255,181,71,.35);color:var(--amber);border-radius:var(--r2);padding:9px 12px;font-size:13px;margin-bottom:12px}
.empty{color:var(--mute);font-size:13.5px;padding:10px 0}
details.acc{border-top:1px solid var(--line)}
details.acc:first-of-type{border-top:0}
details.acc summary{list-style:none;cursor:pointer;padding:12px 0;display:flex;align-items:center;gap:10px;font-weight:700;font-size:14.5px}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary .car{margin-left:auto;color:var(--dim);transition:transform .2s}
details.acc[open] summary .car{transform:rotate(90deg)}
details.acc .body{padding:0 0 12px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;color:var(--mute);font-weight:600;font-size:11.5px;padding:6px 4px;border-bottom:1px solid var(--line)}
table.t td{padding:7px 4px;border-bottom:1px solid var(--line)}
table.t tr:last-child td{border-bottom:0}
.right{text-align:right}

/* ===== login ===== */
#login{justify-content:center;padding:calc(30px + var(--sat)) 20px calc(30px + var(--sab));background:radial-gradient(120% 60% at 50% 0%,#1A2230 0%,var(--bg) 60%)}
.logo{font:900 40px/.95 var(--disp);letter-spacing:-.02em;text-align:center}
.logo span{color:var(--blue)}
.logo-sub{text-align:center;color:var(--mute);font-size:13px;margin:8px 0 28px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:14px;max-width:420px;margin:0 auto;width:100%}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 10px 12px;display:flex;flex-direction:column;align-items:center;gap:9px;position:relative;cursor:pointer;min-height:140px;justify-content:center}
.pcard:active{transform:scale(.97)}
.pcard .pn{font:700 13px system-ui;text-align:center;word-break:break-word}
.pcard.add{border-style:dashed;color:var(--mute)}
.pcard .del{position:absolute;top:-8px;right:-8px;width:28px;height:28px;border-radius:50%;background:var(--rose);color:#fff;border:0;font-weight:900;display:none;align-items:center;justify-content:center}
.pgrid.editing .pcard .del{display:flex}
.pgrid.editing .pcard{animation:wig .35s ease-in-out infinite alternate}
@keyframes wig{from{transform:rotate(-1deg)}to{transform:rotate(1deg)}}

/* ===== sheets ===== */
.sheet{position:fixed;inset:0;z-index:60;display:none;flex-direction:column;justify-content:flex-end}
.sheet.on{display:flex}
.sheet .bd{position:absolute;inset:0;background:rgba(0,0,0,.6)}
.sheet .pan{position:relative;background:var(--card);border-radius:24px 24px 0 0;max-height:92dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 16px calc(24px + var(--sab));animation:up .25s cubic-bezier(.2,.8,.2,1);max-width:720px;width:100%;margin:0 auto}
.sheet .pan.full{height:100dvh;max-height:100dvh;border-radius:0;padding-top:calc(10px + var(--sat))}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line2);margin:0 auto 12px}
.shead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.shead h2{flex:1}
.x{width:36px;height:36px;border-radius:50%;border:0;background:var(--card2);font-size:18px;display:flex;align-items:center;justify-content:center}

/* ===== rings ===== */
.rings{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ring{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.ring svg{width:92px;height:92px}
.ring .v{font:900 18px var(--disp);margin-top:-62px;height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.ring .v small{font:600 10px system-ui;color:var(--mute);letter-spacing:.02em}
.ring .l{font:700 11.5px system-ui;color:var(--mute);margin-top:6px}
.ring circle.bg{stroke:var(--line);fill:none}
.ring circle.fg{fill:none;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)}
.hero{background:linear-gradient(160deg,#1B2431 0%,var(--card) 60%);border:1px solid var(--line2)}
.hero .hi{font:900 20px/1.15 var(--disp);margin-bottom:2px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 13px}
.tile .k{font:600 11.5px system-ui;color:var(--mute)}
.tile .n{font:900 24px/1.1 var(--disp);margin:4px 0 2px}
.tile .n small{font:700 12px var(--disp);color:var(--mute)}
.tile .s{font-size:11.5px;color:var(--mute)}
.tile.blue .n{color:var(--blue)}.tile.mint .n{color:var(--mint)}.tile.amber .n{color:var(--amber)}.tile.violet .n{color:var(--violet)}

/* plates 3D */
.plates3d{height:120px;perspective:520px;display:flex;align-items:flex-end;justify-content:center;touch-action:none;position:relative}
.pstack{position:relative;width:110px;height:110px;transform-style:preserve-3d;transform:rotateX(62deg) rotateZ(-20deg)}
.plate{position:absolute;left:5px;top:5px;width:100px;height:100px;border-radius:50%;background:radial-gradient(circle at 50% 50%,#0E1114 0 18%,#2B333D 19% 22%,#3C4652 23% 88%,#1E252C 89%);box-shadow:0 0 0 2px #131820;transform-style:preserve-3d}
.plate::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,transparent 0 18%,rgba(91,140,255,.18) 19% 24%,transparent 25%)}
.plate.bar{width:14px;height:14px;left:48px;top:48px;background:#8B93A1;box-shadow:none;border-radius:50%}

/* ===== leaderboard ===== */
.lb{display:flex;flex-direction:column;gap:8px}
.lbrow{display:flex;align-items:center;gap:10px;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:9px 11px}
.lbrow.me{border-color:var(--blue)}
.lbrow .rank{font:900 16px var(--disp);width:26px;text-align:center;color:var(--mute)}
.lbrow .rank.g{color:#FFD166}.lbrow .rank.s{color:#C9D1DB}.lbrow .rank.b{color:#D9925B}
.lbrow .nm{font-weight:700;font-size:14px}
.lbrow .sub{font-size:11.5px;color:var(--mute)}
.lbrow .pts{font:900 18px var(--disp);color:var(--ink)}
.lbrow .pts small{font:600 10px system-ui;color:var(--mute);display:block;text-align:right}
.lbcat{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.lbcat div{background:var(--bg2);border-radius:10px;padding:7px 4px;text-align:center}
.lbcat b{display:block;font:900 15px var(--disp)}
.lbcat span{font-size:10px;color:var(--mute)}

/* ===== charts ===== */
.chart{width:100%;height:auto;display:block}
.chart text{font:600 10px system-ui;fill:var(--mute)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--mute);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}

/* ===== swipe cards ===== */
.sw{position:relative;border-radius:var(--r);margin-bottom:10px;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.sw .under{position:absolute;inset:0;border-radius:var(--r);display:flex;align-items:center;justify-content:space-between;padding:0 20px;font:800 14px var(--disp);background:var(--card2);transition:background .15s}
.sw .under span{opacity:0;transition:opacity .15s;color:#fff}
.sw .top{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;transition:transform .28s cubic-bezier(.2,.8,.2,1),background .3s,border-color .3s;display:flex;align-items:center;gap:12px;will-change:transform}
.sw.drag .top{transition:none}
.sw .ic{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font:900 13px var(--disp);flex:0 0 auto;background:var(--blue-s);color:var(--blue)}
.sw.kardio .ic{background:var(--amber-s);color:var(--amber)}
.sw .tt{font-weight:800;font-size:15px}
.sw .st{font-size:12.5px;color:var(--mute)}
.sw .stt{margin-left:auto;font:900 12px var(--disp);flex:0 0 auto;display:flex;align-items:center;gap:6px}
.sw.done .top{border-color:rgba(52,211,153,.6);background:linear-gradient(90deg,rgba(52,211,153,.22),var(--card) 70%)}
.sw.skip .top{border-color:rgba(251,113,133,.6);background:linear-gradient(270deg,rgba(251,113,133,.22),var(--card) 70%)}
.sw.done .stt{color:var(--mint)}.sw.skip .stt{color:var(--rose)}
.sw .undo{border:0;background:var(--bg2);color:var(--mute);border-radius:999px;width:30px;height:30px;font-size:14px}
.sw.pop .top{animation:pop .35s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{0%{transform:scale(.97)}50%{transform:scale(1.02)}100%{transform:none}}
.hint{font-size:12px;color:var(--dim);text-align:center;margin:2px 0 10px}
.wkdots{display:flex;gap:6px;margin:6px 0 12px}
.wkdots i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.wkdots i.d{background:var(--mint)}.wkdots i.s{background:var(--rose)}

/* ===== program ===== */
.exrow{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:flex-start}
.exrow:first-child{border-top:0}
.exrow .num{width:26px;height:26px;border-radius:8px;background:var(--bg2);font:900 12px var(--disp);display:flex;align-items:center;justify-content:center;flex:0 0 auto;color:var(--mute)}
.exrow .num.ss{background:var(--violet-s);color:var(--violet)}
.exrow .nm{font-weight:700;font-size:14.5px}
.exrow .sets{font:700 12.5px var(--mono);color:var(--blue);white-space:nowrap}
.exrow .cue{font-size:12.5px;color:var(--mute);margin-top:3px;display:none}
.exrow.open .cue{display:block}
.exrow .tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.ssnote{font-size:11px;color:var(--violet);font-weight:700}
.logset{display:grid;grid-template-columns:1fr auto 1fr auto 1fr auto 1fr;gap:4px;align-items:center;margin-top:6px}
.logset input{padding:8px 4px;text-align:center;font-size:15px;border-radius:8px}
.logset .x{width:auto;height:auto;background:none;color:var(--dim);font-size:11px}
.hist{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.hist:first-child{border-top:0}

/* ===== food ===== */
.dchk{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dchk button{border:1.5px solid var(--line);background:var(--bg2);border-radius:14px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:74px;font:700 12px system-ui;color:var(--mute);transition:.2s}
.dchk button .e{font-size:22px}
.dchk button[aria-pressed="true"]{background:var(--mint-s);border-color:var(--mint);color:var(--mint)}
.dchk button:active{transform:scale(.95)}
.numrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.numrow div{background:var(--bg2);border-radius:14px;padding:10px 8px;text-align:center}
.numrow b{display:block;font:900 17px var(--disp);color:var(--amber);white-space:nowrap}
.numrow span{font-size:11px;color:var(--mute)}
.rule{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.rule:first-child{border-top:0}
.rule .e{font-size:26px;width:36px;text-align:center;flex:0 0 auto}
.rule b{display:block;font-size:14.5px}
.rule p{margin:2px 0 0;font-size:13.5px}
.rule .why{margin-top:6px;font-size:12.5px;color:var(--mute);display:none}
.rule.open .why{display:block}
.rule .whyb{border:0;background:none;color:var(--blue);font:700 12px system-ui;padding:4px 0;margin-top:2px}
sup.src{color:var(--amber);font-weight:700;font-size:10px;margin-left:2px}
.yesno{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.yesno div{border-radius:14px;padding:10px 12px;font-size:13.5px}
.yesno .y{background:var(--mint-s);border:1px solid rgba(52,211,153,.35)}
.yesno .n{background:var(--rose-s);border:1px solid rgba(251,113,133,.35)}
.yesno b{display:block;font:900 12px var(--disp);margin-bottom:6px;letter-spacing:.06em}
.yesno li{margin:4px 0}
.yesno ul{margin:0;padding-left:18px}
.pyr{display:flex;flex-direction:column;align-items:center;gap:3px}
.pyr div{background:var(--bg2);border-radius:8px;padding:5px 10px;font-size:12px;text-align:center;border:1px solid var(--line)}
.srcs li{font-size:12.5px;margin:6px 0;color:var(--mute)}
.srcs a{word-break:break-all}

/* ===== kitchen / shop ===== */
.kitchen{--kp:#FBF7EE;--kink:#2B2A26;--kmute:#7A776E;--kline:#E6E0D2;background:var(--kp);color:var(--kink);margin:-12px -14px calc(-96px - var(--sab));padding:14px 14px calc(110px + var(--sab));min-height:100dvh;background-image:linear-gradient(var(--kline) 1px,transparent 1px),linear-gradient(90deg,var(--kline) 1px,transparent 1px);background-size:38px 38px;background-position:-1px -1px}
.kitchen h2,.kitchen h3{color:var(--kink)}
.kitchen .btn{border-color:#D8D2C4;background:#fff;color:var(--kink)}
.kitchen .btn.pri{background:#2B2A26;border-color:#2B2A26;color:#fff}
.kitchen input{background:#fff;border-color:#D8D2C4;color:var(--kink)}
.fridge{background:linear-gradient(90deg,#DEE2E6 0%,#F4F6F8 18%,#E9ECEF 50%,#F2F4F6 82%,#D9DEE3 100%);border:2px solid #C5CBD2;border-radius:22px 22px 26px 26px;padding:16px 14px 18px;position:relative;min-height:250px;box-shadow:inset 0 0 0 6px rgba(255,255,255,.55),0 14px 30px rgba(43,42,38,.14)}
.fridge::before{content:"";position:absolute;left:14px;right:14px;top:58%;height:3px;border-radius:3px;background:#C5CBD2}
.fridge::after{content:"";position:absolute;right:20px;top:20px;width:8px;height:30%;border-radius:4px;background:#B8BFC7;box-shadow:0 1px 0 #fff}
.fridge .fh{font:700 22px var(--hand);color:#4B4A45;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.fridge .fh .cnt{font:700 11px system-ui;background:#2B2A26;color:#fff;border-radius:999px;padding:2px 8px}
.notes{display:flex;flex-wrap:wrap;gap:9px;position:relative;z-index:1}
.note{background:#FFF3A3;color:#2B2A26;padding:7px 9px 8px;border-radius:3px;font:600 16px/1.12 var(--hand);box-shadow:2px 3px 8px rgba(0,0,0,.14);position:relative;cursor:pointer;max-width:48%;transform:rotate(var(--rot,-1.5deg));animation:pin .3s cubic-bezier(.2,.9,.3,1.4)}
.note::before{content:"";position:absolute;left:50%;top:-7px;width:14px;height:14px;border-radius:50%;background:var(--mag,#E5484D);transform:translateX(-50%);box-shadow:inset -2px -2px 3px rgba(0,0,0,.25),0 2px 3px rgba(0,0,0,.25)}
.note:nth-child(3n){background:#CDEBFF;--rot:1.5deg;--mag:#3E63DD}
.note:nth-child(3n+1){--mag:#30A46C}
.note:nth-child(4n){background:#FFD9E0;--rot:-2.5deg;--mag:#FFC53D}
.note small{display:block;font:600 11px system-ui;color:#6B6A63}
.note .rm{position:absolute;right:-6px;top:-8px;width:20px;height:20px;border-radius:50%;background:#2B2A26;color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;opacity:.85}
@keyframes pin{from{transform:scale(.6) rotate(var(--rot,-1.5deg));opacity:0}to{transform:scale(1) rotate(var(--rot,-1.5deg));opacity:1}}
.fempty{font:600 20px var(--hand);color:#8A8880;text-align:center;padding:24px 10px}
.shelf{margin-top:16px}
.shelf h3{font:700 22px var(--hand);color:#4B4A45;margin:0 0 6px;display:flex;align-items:center;gap:8px}
.shelf .plank{background:linear-gradient(#E9D9BC,#C9B18A);border-radius:4px;height:8px;box-shadow:0 4px 6px rgba(0,0,0,.12);margin-top:-2px}
.items{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none;scroll-snap-type:x proximity}
.items::-webkit-scrollbar{display:none}
.item{flex:0 0 auto;background:#fff;border:1.5px solid #E3DDCF;border-radius:14px;padding:9px 11px;display:flex;flex-direction:column;gap:2px;min-width:120px;scroll-snap-align:start;cursor:pointer;box-shadow:0 2px 0 #E3DDCF}
.item:active{transform:translateY(1px)}
.item b{font-size:13.5px}
.item span{font-size:11.5px;color:var(--kmute)}
.item .tg{font-size:10.5px}
.item.on{border-color:#2B2A26;background:#FFF3A3;box-shadow:0 2px 0 #C9B14F}
.pad{background:#fff;border-radius:6px 6px 14px 14px;padding:26px 16px 18px;position:relative;box-shadow:0 10px 24px rgba(43,42,38,.14);background-image:repeating-linear-gradient(transparent 0 31px,#E3EAF2 31px 32px);margin-top:18px;transform:rotate(-.6deg)}
.pad::before{content:"";position:absolute;left:50%;top:-10px;width:90px;height:22px;background:rgba(255,235,120,.75);transform:translateX(-50%) rotate(-2deg);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.pad h3{font:700 26px var(--hand);margin:0 0 8px;color:#2B2A26}
.pitem{display:flex;align-items:center;gap:10px;height:32px;font:600 19px var(--hand);color:#2B2A26;cursor:pointer}
.pitem input{width:20px;height:20px;accent-color:#30A46C;flex:0 0 auto;padding:0;margin:0}
.pitem.d span{text-decoration:line-through;color:#A19E93}
.pitem .pr{margin-left:auto;font:600 12px var(--mono);color:#7A776E}
.pad .tot{margin-top:8px;font:700 22px var(--hand);display:flex;justify-content:space-between;border-top:2px solid #2B2A26;padding-top:6px}
.presets{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.presets::-webkit-scrollbar{display:none}
.presets .btn{flex:0 0 auto}

/* ===== health ===== */
.srcbox{border:1px dashed var(--line2);border-radius:14px;padding:12px;font-size:13px;margin-top:8px}
.srcbox ol{margin:6px 0 0;padding-left:18px}
.srcbox li{margin:3px 0}
.file{display:block;border:1.5px dashed var(--blue);background:var(--blue-s);border-radius:14px;padding:16px;text-align:center;font-weight:700;color:var(--blue);cursor:pointer;margin-top:10px}
.file input{display:none}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:8px;display:none}
.prog i{display:block;height:100%;background:var(--blue);width:0;transition:width .2s}
.hgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.hgrid div{background:var(--bg2);border-radius:12px;padding:8px 4px;text-align:center}
.hgrid b{display:block;font:900 16px var(--disp)}
.hgrid span{font-size:10px;color:var(--mute)}

/* ===== FAB & chat ===== */
#fab{position:fixed;right:16px;bottom:calc(78px + var(--sab));z-index:40;width:54px;height:54px;border-radius:50%;border:0;background:linear-gradient(135deg,#7C9BFF,#5B8CFF);color:#0B1220;box-shadow:0 10px 24px rgba(91,140,255,.4);font-size:22px;display:flex;align-items:center;justify-content:center}
#fab:active{transform:scale(.93)}
.chat{display:flex;flex-direction:column;height:100%}
.msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:8px 0}
.msg{max-width:88%;padding:10px 13px;border-radius:16px;font-size:14.5px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
.msg.u{align-self:flex-end;background:var(--blue);color:#0B1220;border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--card2);border-bottom-left-radius:4px}
.msg.a.err{background:var(--rose-s);color:var(--rose)}
.typing{align-self:flex-start;color:var(--mute);font-size:13px;padding:6px 4px}
.cin{display:flex;gap:8px;align-items:flex-end;padding-top:8px;border-top:1px solid var(--line)}
.cin textarea{flex:1;min-height:44px;max-height:120px;resize:none;border-radius:16px}
.cin button{width:44px;height:44px;border-radius:50%;flex:0 0 auto}

/* ===== game ===== */
#game{position:fixed;inset:0;z-index:90;background:#0E1114;display:none;flex-direction:column}
#game.on{display:flex}
#gc{flex:1;width:100%;height:100%;display:block;touch-action:none}
.gover{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(14,17,20,.86);padding:20px;text-align:center}
.gover h2{font-size:26px}
.gover .sc{font:900 54px/1 var(--disp);color:var(--blue)}
.gtop{position:absolute;top:calc(10px + var(--sat));left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;pointer-events:none;z-index:3}
.gtop .btn{pointer-events:auto}
.gsc{font:900 26px var(--disp)}
.glb{width:100%;max-width:340px;text-align:left}
.glb div{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--line);font-size:14px}

/* confetti */
#conf{position:fixed;inset:0;pointer-events:none;z-index:70}
@media print{.tabbar,#fab,header.top{display:none}}

/* ===== v3 additions ===== */
#shAsk{z-index:75}
#shAsk .pan{max-height:70dvh}
.card{position:relative}
.credo{background:linear-gradient(135deg,#1E2A3A 0%,#171D23 55%,#1A1F26 100%);border:1px solid #2C3A4D}
.credo .ct{font:600 16px/1.4 system-ui;margin:0}
.credo .cm{font:600 11px system-ui;color:var(--mute);margin-top:8px;display:flex;justify-content:space-between;align-items:center}
.aisync{display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(91,140,255,.45);color:var(--blue);background:var(--blue-s);border-radius:999px;padding:6px 11px;font:700 12px system-ui;min-height:32px}
.aisync.busy{opacity:.6}
.aisync .dot{width:7px;height:7px;border-radius:50%;background:var(--blue);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
.tabtop{display:flex;align-items:center;gap:8px;margin:0 0 10px}
.tabtop h2{flex:1}
.egg{position:absolute;right:8px;bottom:8px;width:44px;height:52px;border:0;background:none;padding:0;opacity:.85;cursor:pointer;filter:drop-shadow(0 4px 6px rgba(0,0,0,.5))}
.egg img{height:52px;width:auto;display:block}
.egg:active{transform:scale(.92) rotate(-6deg)}
.subtabs{display:flex;gap:6px;margin:0 0 12px;overflow-x:auto;scrollbar-width:none}
.subtabs::-webkit-scrollbar{display:none}
.subtabs button{flex:0 0 auto;border:1px solid var(--line2);background:var(--bg2);color:var(--mute);border-radius:999px;padding:8px 14px;font:700 13px system-ui;min-height:36px}
.subtabs button[aria-selected="true"]{background:var(--ink);color:#0E1114;border-color:var(--ink)}
/* log editor */
.lex{border-top:1px solid var(--line);padding:10px 0;position:relative;background:var(--card)}
.lex:first-child{border-top:0}
.lex.dragging{opacity:.35}
.lex .hd{display:flex;align-items:center;gap:8px}
.lex .hd input.nm{flex:1;font:700 14px system-ui;padding:7px 9px;border-radius:9px;background:transparent;border-color:transparent}
.lex .hd input.nm:focus{background:var(--bg2);border-color:var(--line2)}
.lex .grip{width:34px;height:34px;border-radius:9px;background:var(--bg2);color:var(--dim);display:flex;align-items:center;justify-content:center;font-size:16px;touch-action:none;cursor:grab;flex:0 0 auto;user-select:none;-webkit-user-select:none}
.lex .rm{width:30px;height:30px;border-radius:50%;border:0;background:transparent;color:var(--dim);font-size:16px}
.sets{margin-top:6px;display:flex;flex-direction:column;gap:5px}
.setrow{display:grid;grid-template-columns:22px 1fr 18px 1fr auto auto;gap:6px;align-items:center}
.setrow .idx{font:700 11px var(--mono);color:var(--dim);text-align:center}
.setrow input{padding:9px 6px;text-align:center;font-size:16px;border-radius:9px}
.setrow .x{color:var(--dim);font-size:12px;text-align:center}
.setrow .drop{border:1.5px solid var(--line2);background:var(--bg2);color:var(--mute);border-radius:8px;padding:0 8px;height:38px;font:800 11px var(--disp);letter-spacing:.04em;min-width:52px}
.setrow .drop[aria-pressed="true"]{background:var(--rose-s);border-color:var(--rose);color:var(--rose)}
.setrow.d input{border-color:rgba(251,113,133,.45)}
.setrow .del{width:30px;height:38px;border:0;background:transparent;color:var(--dim);font-size:16px}
.addset{border:1.5px dashed var(--line2);background:transparent;color:var(--mute);border-radius:9px;padding:7px;font:700 12px system-ui;width:100%;margin-top:4px;min-height:34px}
.lastline{font-size:11.5px;color:var(--mint);margin-top:4px}
.savestate{font:600 11.5px system-ui;color:var(--mute)}
.savestate.ok{color:var(--mint)}
.dragghost{position:fixed;left:16px;right:16px;pointer-events:none;z-index:99;opacity:.9;background:var(--card2);border:1px solid var(--blue);border-radius:12px;padding:8px 12px;font:700 14px system-ui;box-shadow:0 12px 30px rgba(0,0,0,.5)}
/* food journal */
.macro{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.macro div{background:var(--bg2);border-radius:12px;padding:8px 4px;text-align:center}
.macro b{display:block;font:900 15px var(--disp)}
.macro span{font-size:10px;color:var(--mute)}
.macro i{display:block;height:4px;border-radius:2px;background:var(--line);margin-top:6px;overflow:hidden}
.macro i b{display:block;height:100%;width:0;border-radius:2px}
.meal{display:flex;gap:11px;align-items:center;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.meal:first-child{border-top:0}
.meal .th{width:56px;height:56px;border-radius:12px;background:var(--bg2);object-fit:cover;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:24px}
.meal .mn{font-weight:700;font-size:14.5px}
.meal .ms{font-size:12px;color:var(--mute)}
.meal .mk{margin-left:auto;text-align:right;font:800 13px var(--mono)}
.meal .mk small{display:block;font:600 10px system-ui;color:var(--mute)}
.meal.pending .th{outline:2px dashed var(--amber)}
.dayrow{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.dayrow .btn{min-height:36px;padding:6px 12px}
.dayrow b{flex:1;text-align:center;font:800 14px var(--disp)}
.photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.photos img{width:72px;height:72px;border-radius:12px;object-fit:cover;border:1px solid var(--line2)}
.itemrow{display:grid;grid-template-columns:1fr 60px 62px 52px;gap:5px;align-items:center;margin-top:5px}
.itemrow input{padding:8px 6px;font-size:14px;border-radius:8px}
.itemrow input.g,.itemrow input.k,.itemrow input.p{text-align:center}
.itemhead{display:grid;grid-template-columns:1fr 60px 62px 52px;gap:5px;font:600 10.5px system-ui;color:var(--mute);margin-top:8px;padding:0 4px}
.ainote{background:var(--blue-s);border:1px solid rgba(91,140,255,.3);border-radius:12px;padding:9px 11px;font-size:13px;margin-top:10px}
/* recipes */
.rcard{display:flex;gap:11px;align-items:center;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.rcard:first-child{border-top:0}
.rcard .rimg{width:60px;height:60px;border-radius:14px;object-fit:cover;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-size:26px;flex:0 0 auto}
.rcard .rt{font-weight:700;font-size:14.5px}
.rcard .rs{font-size:12px;color:var(--mute)}
.rcard .rm{margin-left:auto;text-align:right;font:800 12px var(--mono)}
.rcard .rm small{display:block;font:600 10px system-ui;color:var(--mute)}
.rgroup{font:800 12px var(--disp);letter-spacing:.06em;text-transform:uppercase;color:var(--violet);margin:12px 0 2px}
.filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:8px}
.filters::-webkit-scrollbar{display:none}
.filters .chip{flex:0 0 auto;cursor:pointer;min-height:32px}
.filters .chip[aria-pressed="true"]{background:var(--ink);color:#0E1114;border-color:var(--ink)}
.scorebar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px}
.scorebar i{display:block;height:100%;background:var(--mint)}
/* shop nutrients */
.nutr{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.nutr button{border:1.5px solid #E3DDCF;background:#fff;border-radius:12px;padding:8px 6px;text-align:center;font:700 11.5px system-ui;color:#2B2A26;min-height:56px;display:flex;flex-direction:column;align-items:center;gap:2px}
.nutr button .e{font-size:18px}
.nutr button.ok{border-color:#30A46C;background:#E9F7EF}
.nutr button.low{border-color:#FFC53D;background:#FFF6DC}
.nutr button.miss{border-color:#E5484D;background:#FDECEC}
.nutr button[aria-pressed="true"]{outline:2px solid #2B2A26}
.sug{background:#fff;border:1.5px solid #E3DDCF;border-radius:12px;padding:10px 12px;margin-top:8px;font-size:13px;color:#2B2A26}
.sug .btn{margin:4px 4px 0 0}
.mbar{display:flex;flex-direction:column;gap:7px}
.mbar div{font-size:12.5px;color:#2B2A26}
.mbar i{display:block;height:8px;border-radius:4px;background:#EDE7D8;overflow:hidden;margin-top:3px}
.mbar i b{display:block;height:100%;border-radius:4px;background:#30A46C}
.mbar i b.low{background:#E5484D}.mbar i b.mid{background:#FFC53D}
.pitem .qty{display:inline-flex;align-items:center;gap:2px;margin-left:6px}
.pitem .qty button{width:24px;height:24px;border-radius:50%;border:1px solid #D8D2C4;background:#fff;font:700 13px system-ui;color:#2B2A26;padding:0}
.pitem .qty span{font:700 12px var(--mono);min-width:16px;text-align:center}
.kitchen .seg{background:#fff;border-color:#D8D2C4}
.kitchen .seg button{color:#7A776E}
.kitchen .seg button[aria-pressed="true"]{background:#2B2A26;color:#fff;box-shadow:none}
.kitchen .banner{background:#FFF6DC;border-color:#F1D48A;color:#7A5A10}
.kitchen .aisync{border-color:#2B2A26;color:#2B2A26;background:#fff}
.badge.ai{background:var(--violet-s);color:var(--violet)}
.seedbox{background:var(--violet-s);border:1px solid rgba(167,139,250,.35);border-radius:var(--r2);padding:10px 12px;font-size:13px;margin-bottom:12px}
.gsprite{position:absolute;left:12px;bottom:calc(14px + var(--sab));height:80px;opacity:.9;pointer-events:none}
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="login" class="screen">
  <div class="logo" id="logo">CVIČ TY<br><span>PIČ</span></div>
  <div class="logo-sub">ThePhilosopher × BociaN × Agiraa · tréningy, sila, strava</div>
  <div class="pgrid" id="pgrid"></div>
  <div class="center mt"><button class="btn ghost sm" id="editProfiles">Upraviť profily</button></div>
  <div class="banner" id="loginBanner" hidden></div>
</div>

<!-- ================= APP ================= -->
<div id="app" class="screen" hidden>
  <header class="top">
    <div class="in">
      <button class="ava" id="hAva" aria-label="Profil a nastavenia"></button>
      <div class="grow">
        <div class="brand" id="brand">CVIČ TY <em>PIČ</em></div>
        <div class="hname" id="hName"></div>
      </div>
      <div class="streak" id="hStreak" title="Séria týždňov">🔥 <span>0</span></div>
    </div>
  </header>

  <main id="main">
    <section id="tab-home" role="tabpanel"></section>
    <section id="tab-train" role="tabpanel" hidden></section>
    <section id="tab-food" role="tabpanel" hidden></section>
    <section id="tab-shop" role="tabpanel" hidden></section>
    <section id="tab-health" role="tabpanel" hidden></section>
  </main>

  <nav class="tabbar" role="tablist" aria-label="Sekcie">
    <button role="tab" data-tab="home" aria-selected="true"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Domov</button>
    <button role="tab" data-tab="train" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M2 12h3M19 12h3"/><rect x="5" y="8" width="3" height="8" rx="1"/><rect x="16" y="8" width="3" height="8" rx="1"/><path d="M8 12h8"/><rect x="3" y="10" width="2" height="4" rx=".5"/><rect x="19" y="10" width="2" height="4" rx=".5"/></svg>Tréning</button>
    <button role="tab" data-tab="food" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M7 3v18M4 3v5a3 3 0 006 0V3"/><path d="M17 3c-2 0-3 3-3 6s1 4 3 4v8"/></svg>Jedlo</button>
    <button role="tab" data-tab="shop" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M3 4h2l2.4 11.2a2 2 0 002 1.6h7.9a2 2 0 002-1.6L21 8H6.3"/><circle cx="9" cy="20" r="1.3"/><circle cx="17" cy="20" r="1.3"/></svg>Nákup</button>
    <button role="tab" data-tab="health" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M3 12h4l2-5 3 10 3-7 1.5 2H21"/></svg>Zdravie</button>
  </nav>

  <button id="fab" aria-label="Chat s Claude">✦</button>
</div>

<!-- ================= SHEETS ================= -->
<div class="sheet" id="shAsk"><div class="bd" id="askBd"></div>
  <div class="pan" style="text-align:center"><div class="grab"></div><p id="askMsg" style="font-size:15px;margin:6px 0 16px"></p><div class="row" style="gap:8px"><button class="btn grow" id="askNo">Zrušiť</button><button class="btn pri grow" id="askYes">Áno</button></div></div>
</div>

<div class="sheet" id="shProfile"><div class="bd" data-close="shProfile"></div>
  <div class="pan">
    <div class="grab"></div>
    <div class="shead"><h2 id="profTitle">Nový profil</h2><button class="x" data-close="shProfile">✕</button></div>
    <div class="row">
      <button type="button" class="ava big" id="profAvaPick" aria-label="Vybrať fotku"><span>+📷</span></button>
      <input type="file" accept="image/*" id="profImg" style="position:absolute;opacity:0;width:1px;height:1px;left:-9999px">
      <div class="grow">
        <label class="lbl">Meno</label>
        <input id="profName" placeholder="napr. BociaN" maxlength="24">
        <button class="btn ghost sm" id="profAvaDel" style="margin-top:6px" hidden>Odstrániť fotku</button>
      </div>
    </div>
    <div class="fieldrow">
      <div><label class="lbl">Váha (kg)</label><input id="profBw" type="number" inputmode="decimal" placeholder="85"></div>
      <div><label class="lbl">Výška (cm)</label><input id="profH" type="number" inputmode="numeric" placeholder="180"></div>
    </div>
    <div class="fieldrow">
      <div><label class="lbl">Vek</label><input id="profAge" type="number" inputmode="numeric" placeholder="23"></div>
      <div><label class="lbl">Pohlavie</label><div class="seg" id="profSex"><button data-v="m" aria-pressed="true">Muž</button><button data-v="f">Žena</button></div></div>
    </div>
    <div class="fieldrow">
      <div><label class="lbl">% tuku teraz (odhad)</label><input id="profBf" type="number" inputmode="decimal" placeholder="17"></div>
      <div><label class="lbl">% tuku cieľ</label><input id="profBfT" type="number" inputmode="decimal" placeholder="10"></div>
    </div>
    <label class="lbl">Koľko rokov cvičíš so železom</label>
    <div class="seg" id="profExp"><button data-v="0-1" aria-pressed="true">0–1</button><button data-v="1-3">1–3</button><button data-v="3+">3+</button></div>
    <label class="lbl">Hlavný cieľ (podľa toho sa počítajú kalórie a bielkoviny)</label>
    <div class="seg" id="profGoal"><button data-v="bulk" aria-pressed="true">Nabrať svaly</button><button data-v="recomp">Svaly + spáliť tuk</button><button data-v="cut">Schudnúť</button><button data-v="maintain">Udržať</button></div>
    <label class="lbl">Cieľ vlastnými slovami – Claude ho číta pri všetkom (kredo, hodnotenie, chat, jedlo)</label>
    <textarea id="profGoalText" rows="3" placeholder="napr. Chcem zhodiť tuk zo 17 % na 10 % a pritom nabrať svaly. Hlavne byť zdravý, energický, silný, mať zdravé kĺby, byť flexibilný."></textarea>
    <label class="lbl">Odkiaľ berieš zdravotné dáta</label>
    <div class="seg" id="profSrc"><button data-v="manual" aria-pressed="true">Ručne</button><button data-v="oura">Oura</button><button data-v="apple">iPhone</button><button data-v="garmin">Garmin</button></div>
    <label class="row mt" style="gap:12px;cursor:pointer"><input type="checkbox" id="profDia" style="width:22px;height:22px;accent-color:var(--violet)"><span><b>Mám diastázu brucha</b><br><span class="small mute">Namiesto klasického brucha dostaneš bezpečné cviky na hlboký stred tela.</span></span></label>
    <div class="row mt" style="gap:8px"><button class="btn pri grow" id="profSave">Uložiť profil</button></div>
  </div>
</div>

<div class="sheet" id="shSettings"><div class="bd" data-close="shSettings"></div>
  <div class="pan"><div class="grab"></div><div class="shead"><h2>Profil a nastavenia</h2><button class="x" data-close="shSettings">✕</button></div><div id="setBody"></div></div>
</div>

<div class="sheet" id="shSession"><div class="bd" data-close="shSession"></div>
  <div class="pan"><div class="grab"></div><div class="shead"><h2 id="sesTitle"></h2><button class="x" data-close="shSession">✕</button></div><div id="sesBody"></div></div>
</div>

<div class="sheet" id="shLog"><div class="bd" data-close="shLog"></div>
  <div class="pan"><div class="grab"></div><div class="shead"><h2>Meranie</h2><span class="savestate" id="logState"></span><button class="x" data-close="shLog">✕</button></div><div id="logBody"></div></div>
</div>

<div class="sheet" id="shMeal"><div class="bd" data-close="shMeal"></div>
  <div class="pan"><div class="grab"></div><div class="shead"><h2 id="mealTitle">Jedlo</h2><span class="savestate" id="mealState"></span><button class="x" data-close="shMeal">✕</button></div><div id="mealBody"></div></div>
</div>

<div class="sheet" id="shRecipe"><div class="bd" data-close="shRecipe"></div>
  <div class="pan"><div class="grab"></div><div class="shead"><h2 id="recTitle">Recept</h2><button class="x" data-close="shRecipe">✕</button></div><div id="recBody"></div></div>
</div>

<div class="sheet" id="shChat"><div class="bd" data-close="shChat"></div>
  <div class="pan full">
    <div class="shead"><div class="ava" style="width:34px;height:34px;background:var(--blue);color:#0B1220;font-size:16px">✦</div><h2>Claude</h2><button class="x" data-close="shChat">✕</button></div>
    <div class="seg" id="effort" style="margin-bottom:8px"><button data-v="light">Light</button><button data-v="mid" aria-pressed="true">Stred</button><button data-v="high">High</button><button data-v="max">Max</button></div>
    <div class="chat">
      <div class="msgs" id="msgs"></div>
      <div class="cin"><textarea id="cinp" rows="1" placeholder="Opýtaj sa na tréning, stravu, doplnky…"></textarea><button class="btn pri" id="csend">➤</button></div>
      <div class="tiny mute center" style="margin-top:6px" id="chatNote">Claude vidí tvoj profil, cieľ, plán a posledné štatistiky. Nie je lekár. <button class="btn ghost sm" id="cclear" style="min-height:24px;padding:2px 8px;font-size:11px">Vymazať chat</button></div>
    </div>
  </div>
</div>

<!-- ================= GAME ================= -->
<div id="game">
  <canvas id="gc"></canvas>
  <div class="gtop"><div class="gsc" id="gsc">0</div><button class="btn sm" id="gclose">✕ Zavrieť</button></div>

a placku plátok syra, nech sa roztopí.","Omáčku zmiešaj v pohári.","Žemľu prerež a 1 min opeč na sendvičovom grile.","Skladaj: omáčka → šalát → paradajka → placka so syrom → cibuľa → vrch."],"serve":"On si pokojne pridá BBQ. Piatkový streetfood s oven fries (recept 11).","m":{"kcal":640,"p":45,"c":50,"f":26,"fi":6},"src":"base"},{"id":"base6","t":"Talianske šošovicové ragù","s":"soffritto klasika · dvojitá dávka, 5–6 porcií","cat":"obed","grp":"","time":"35 min","note":"Základ každej talianskej omáčky: soffritto = cibuľa + mrkva + zeler pomaly na olivovom oleji. Štipka cukru vyváži kyslosť — kvôli Agi dôležité.","ing":["2 PL olivového oleja","1 cibuľa, 1 mrkva, 1 stonka zeleru — všetko nadrobno","3 strúčiky cesnaku","2 PL rajčinového pretlaku","2 × 400 g pasírovaných paradajok","2 konzervy šošovice (scedené) alebo 250 g suchej hnedej, vopred uvarenej","1 ČL oregana","1 bobkový list","½ ČL cukru","soľ, korenie","hrsť čerstvej bazalky na záver"],"steps":["Na oleji restuj soffritto 6–8 min do mäkka (nesmie zhnednúť).","Pridaj cesnak + pretlak, 1 min.","Pasírované paradajky, šošovica, oregano, bobkový list, cukor.","Prikryté mierne bublať 20 min, občas premiešať.","Dosoliť, bobkový list von, vmiešať bazalku."],"serve":"S celozrnnými cestovinami (on 100–120 g suchých, Agi 70–80 g), navrch strúhaný parmezán.","m":{"kcal":620,"p":30,"c":90,"f":12,"fi":16},"src":"base"},{"id":"base7","t":"Grécke gigantes plaki","s":"zapekaná fazuľa v paradajkách · dvojitá dávka","cat":"obed","grp":"","time":"15 min + 25 min rúra","note":"Grécka klasika — presne v tomto tvare ju robí celé Grécko, len s petržlenom namiesto kôpru. Ide aj studená, ideálne batch jedlo.","ing":["3 konzervy veľkej bielej/maslovej fazule (scedené)","4 PL olivového oleja","1 veľká cibuľa nadrobno","4 strúčiky cesnaku","2 × 400 g pasírovaných/krájaných paradajok","1,5 ČL oregana","1 ČL medu","soľ, korenie","hrsť petržlenovej vňate","100 g fety"],"steps":["Rúra 200 °C.","V pekáči alebo panvici do rúry restuj cibuľu na oleji 5 min, pridaj cesnak na 1 min.","Paradajky + oregano + med + soľ, 5 min povariť.","Vmiešaj fazuľu.","Zapekaj odokryté 20–25 min, kým omáčka zhustne a okraje bublú.","Posyp petržlenom a rozdrobenou fetou."],"serve":"S celozrnným chlebom alebo pitou.","m":{"kcal":560,"p":24,"c":70,"f":20,"fi":15},"src":"base"},{"id":"base8","t":"Jemný dal (červená šošovica, tadka)","s":"indická klasika v jemnej verzii","cat":"obed","grp":"","time":"25 min · 4 porcie","note":"Bez chilli v hrnci — chilli vločky na stole pre koho chce. Na 2. deň chutí ešte lepšie.","ing":["300 g červenej šošovice (prepláchnuť)","900 ml vody","1 ČL kurkumy","1 ČL soli","» TADKA","2 PL masla alebo oleja","1 ČL celej rasce","3 strúčiky cesnaku na plátky","1 ČL strúhaného zázvoru","½ ČL garam masaly (voliteľné)"],"steps":["Šošovicu + vodu + kurkumu var odokryté 15 min, občas pomiešaj a pozbieraj penu; dosoľ.","Tadka: na malej panvici rozohrej maslo, rasca 30 s (rozvonia sa), cesnak a zázvor 1 min dozlatista, garam masala 10 s a hneď z ohňa.","Tadku vlej do šošovice a premiešaj."],"serve":"S ryžou alebo pitou, lyžica jogurtu navrch (Agi väčšia). Vydrží 3 dni.","m":{"kcal":430,"p":25,"c":60,"f":9,"fi":14},"src":"base"},{"id":"base9","t":"Ázijské opekané rezance","s":"chow mein štýl · bez ustricovej omáčky","cat":"obed","grp":"","time":"25 min · 3–4 porcie","note":"Klasická chow-mein omáčka bez ustricovej (morské plody) — sójovka + med + sezamový olej ju plne nahradia.","ing":["250 g rezancov (celozrnné špagety fungujú)","400 g kuracích pŕs na pásiky (alebo tofu)","1 mrkva na tenké prúžky","1 paprika na pásiky","3 jarné cibuľky","hrsť hrášku/edamame","» OMÁČKA","4 PL sójovky","1 PL medu","1 ČL sezamového oleja","1 strúčik cesnaku","1 ČL strúhaného zázvoru","1 ČL škrobu + 3 PL vody"],"steps":["Rezance uvar o 1 min kratšie, sceď.","Omáčku zmiešaj v pohári.","Vo veľkej panvici na vysokom stupni opeč kura na 1 PL oleja 4–5 min, odlož.","Do panvice zelenina, 3 min za stáleho miešania.","Vráť kura, pridaj rezance a omáčku, 2 min premiešavaj, kým omáčka zhustne a obalí rezance.","Posyp sezamom a jarnou cibuľkou."],"serve":"Chilli olej na stole pre koho chce.","m":{"kcal":600,"p":42,"c":70,"f":15,"fi":6},"src":"base"},{"id":"base10","t":"Pečené stripsy s parmezánom + 3 dipy","s":"zdravší „černohorský\" · z rúry","cat":"večera","grp":"","time":"30 min","note":"Parmezán v strúhanke robí zázraky. Bez oleja navrchu nebudú zlaté — nezabudni pokvapkať.","ing":["600 g kuracích pŕs na pásiky","2 vajcia rozšľahané","100 g strúhanky (ideálne panko)","40 g najemno strúhaného parmezánu","1 ČL sladkej papriky","½ ČL cesnakového prášku","½ ČL soli","olivový olej na pokvapkanie","» DIPY","med-horčica: 2 PL jogurtu + 1 PL medu + 1 PL dijonu","cesnakovo-jogurtový: 4 PL jogurtu + 1 strúčik cesnaku + soľ","BBQ z fľaše (on)"],"steps":["Rúra 220 °C.","Dve misky: rozšľahané vajcia / strúhanka + parmezán + koreniny.","Pásik do vajca → do strúhanky, pritlačiť → na plech s papierom.","Pokvapkaj (alebo sprejuj) olejom.","Peč 15–18 min, v polovici otočiť."],"serve":"S oven fries (recept 11) a zeleninovými paličkami.","m":{"kcal":520,"p":50,"c":35,"f":18,"fi":2},"src":"base"},{"id":"base11","t":"Oven fries — chrumkavé hranolky z rúry","s":"namáčacia technika · airfryer netreba","cat":"príloha","grp":"","time":"15 min + 30 min rúra","note":"Namočenie vyplaví škrob = chrumkavosť. Dôkladné osušenie je kľúčový krok.","ing":["600 g zemiakov","1,5 PL olivového oleja","soľ","voliteľne: sladká paprika / cesnakový prášok po upečení"],"steps":["Zemiaky nakrájaj na hranolky ~1 cm.","Namoč 20 min do studenej vody, sceď a dôkladne osuš utierkou.","Premiešaj s olejom a soľou.","Rúra 220 °C, plech s papierom, jedna vrstva — hranolky sa nesmú dotýkať.","Peč 30 min, v polovici otočiť.","Voliteľne posyp paprikou či cesnakovým práškom."],"serve":"K burgrom, stripsom aj len tak s dipom.","m":{"kcal":250,"p":5,"c":45,"f":6,"fi":5},"src":"base"},{"id":"base12","t":"Omelety, praženica, pizza quesadilla","s":"vaječné základy + vaša klasika","cat":"raňajky","grp":"Vajcia","time":"5–12 min","note":"Žiadne vajcia natvrdo ani tečúce — len poriadne hotové omelety a praženica.","ing":["2–3 vajcia na osobu","štipka soli","trocha oleja alebo masla","náplne: špenát, paradajky, šunka Pikok, syr","» NA QUESADILLU","1 tortilla","2 PL pasírovaných paradajok + oregano + štipka soli","šunka, mozzarella/syr, rukola"],"steps":["OMELETA: vajcia + soľ rozšľahaj vidličkou 20 s. Panvica stredný stupeň s tukom. Vylej, 30 s nechaj, potom stierkou ťahaj okraje do stredu. Keď je vrch takmer tuhý, na polovicu daj náplň, prelož, 30 s a von.","PRAŽENICA: rozšľahané vajcia na strednom stupni pomaly miešaj stierkou do jemných, úplne tuhých kúskov.","PIZZA QUESADILLA: urob tenkú omeletu vo veľkosti tortilly → polož na ňu tortillu a otoč naraz (omeleta hore) → potri paradajkami s oreganom → šunka, syr, rukola → prelož na polmesiac → 2–3 min na sendvičovom grile."],"serve":"S celozrnným toastom a zeleninou (vláknina-first!).","m":{"kcal":420,"p":30,"c":25,"f":22,"fi":3},"src":"base"},{"id":"base13","t":"Ovos — overnight aj teplý","s":"pomery, ktoré fungujú","cat":"raňajky","grp":"Ovos","time":"večer 3 min / ráno 5 min","note":"Whey nikdy do vriacej kaše — zrazí sa. Vmiešať až z ohňa.","ing":["» OVERNIGHT (pomer 1:1)","50 g vločiek (on 80 g)","120 ml mlieka","50 g jogurtu","1 ČL chia","1 PL mletého ľanu","1 ČL medu","» TEPLÁ KAŠA","50–80 g vločiek","250 ml mlieka","ovocie, semiačka, lyžica arašidového masla"],"steps":["OVERNIGHT: všetko do pohára, zamiešať, cez noc chladnička, ráno ovocie navrch.","Varianty: kakao + ½ odmerky whey (mlieka o trochu viac) · nastrúhané jablko + škorica · mrazené jahody (cez noc sa rozmrazia).","TEPLÁ: vločky + mlieko 4–5 min miešať na miernom stupni. Z ohňa vmiešať whey. Ovocie, semiačka, arašidové maslo navrch."],"serve":"Jeho denná klasika; ovos je jedno z najzdravších raňajkových jedál.","m":{"kcal":420,"p":18,"c":60,"f":12,"fi":9},"src":"base"},{"id":"base14","t":"Smoothies — 3 kombá","s":"nový mixér v akcii","cat":"snack","grp":"Smoothie","time":"3 min","note":"Špenát v smoothie necítiť — zelené pokojne aj pre Agi.","ing":["» ČOKO-BANÁN-PB (jeho)","1 banán","30 g čokoládovej srvátky","1 PL arašidového masla","250 ml mlieka","4 kocky ľadu","» JAHODA-MANGO (Agi — jemné, bez orechov)","150 g mrazeného manga alebo jahôd","150 g gréckeho jogurtu","150 ml mlieka","1 ČL medu","1 PL mletého ľanu","» ZELENÉ (obaja)","1 banán","veľká hrsť špenátu","1 jablko","200 ml vody/mlieka","1 PL mletého ľanu"],"steps":["Všetko do mixéra, mixovať do hladka (~45 s).","Hustejšie = menej tekutiny; redšie = viac."],"serve":"Po tréningu, ako snack alebo namiesto sladkého.","m":{"kcal":380,"p":28,"c":45,"f":10,"fi":5},"src":"base"},{"id":"base15","t":"Rýchle večere — panini, caprese, taniere","s":"5 minút, nula stresu","cat":"večera","grp":"","time":"5–8 min","note":"Večere sú zámerne rýchlovky — hlavné varenie sa deje cez obedy.","ing":["» PANINI","celozrnný chlieb","šunka Pikok 92 %","plátok syra (gouda/eidam)","paradajka, rukola","» CAPRESE TANIER","mozzarella","cherry paradajky","rukola","olivový olej, bazalka, štipka soli","celozrnné pečivo","» COTTAGE TANIER","cottage (on 250 g / Agi 150 g)","zelenina, pažítka, pečivo"],"steps":["PANINI: poskladať → sendvičový gril 4 min. Caprese verzia: mozzarella + paradajka + bazalka.","CAPRESE: všetko na tanier, pokvapkať olejom. Hotovo za 5 minút bez varenia.","COTTAGE: naservírovať a nekomplikovať."],"serve":"Vláknina-first: zelenina na tanieri sa je prvá.","m":{"kcal":450,"p":30,"c":40,"f":18,"fi":4},"src":"base"},{"id":"base16","t":"Sladké na každý deň","s":"kryje dennú chuť na sladké bez keksov","cat":"sladké","grp":"Jogurtový bowl","time":"3–5 min","note":"Horká čokoláda ≥70 % + bobule = zároveň polyfenolová bomba.","ing":["» JOGURT + ČOKOLÁDA","grécky jogurt","horká čokoláda ≥70 % nasekaná","maliny/čučoriedky","» TVAROHOVÝ KRÉM","125 g odtučneného tvarohu","100 g gréckeho jogurtu","½ odmerky srvátky","1 ČL medu, ovocie navrch","» CHIA PUDING","3 PL chia","250 ml mlieka","1 ČL medu, ovocie navrch"],"steps":["JOGURT: nasekať čokoládu, zamiešať do jogurtu, ovocie navrch.","KRÉM: vymiešať dohladka lyžicou alebo mixérom.","CHIA: zamiešať, po 10 min ešte raz zamiešať (nezhrčkavie), cez noc do chladničky."],"serve":"Každý deň jedno z troch — podľa chuti.","m":{"kcal":280,"p":20,"c":25,"f":10,"fi":5},"src":"base"},{"id":"base17","t":"Nice cream / sorbet","s":"zmrzlinový deň 1× mesačne","cat":"sladké","grp":"","time":"5 min (banány zamraziť deň vopred)","note":"Bez trans-tukov a cukru z obchodu. Banány nakrájať PRED zamrazením!","ing":["» ČOKOLÁDOVO-PROTEÍNOVÁ","2 mrazené banány (nakrájané pred mrazením)","1 odmerka čokoládovej srvátky","3–4 PL mlieka","voliteľne 1 PL arašidového masla","» JAHODOVÝ SORBET (Agi)","300 g mrazených jahôd","3 PL medu","3 PL vody alebo jogurtu"],"steps":["Všetko do mixéra.","Mixovať a zoškrabávať steny, kým nevznikne krém.","Jesť hneď (soft) alebo 1 h do mrazničky."],"serve":"Sobota týždňa A raz za mesiac = zmrzlinový deň.","m":{"kcal":260,"p":20,"c":40,"f":3,"fi":4},"src":"base"}];

/* =====================================================================

   1. 'claude'  – appka beží ako publikovaný artefakt v Claude (window.storage)
   2. 'server'  – appka beží ako webstránka a dáta zdieľa cez Google Apps Script
   3. 'local'   – bez zdieľania, len tento prehliadač
   Vždy sa zapisuje aj do localStorage (rýchly štart + offline).

const LS={get(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch(e){return null;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}},del(k){try{localStorage.removeItem(k);}catch(e){}}};

/* GitHub ako zdieľaný server: dáta = JSON súbory v priečinku kv/ súkromného repozitára */
async function ghApi(a,p={}){
 const g=SRV.gh;if(!g||!g.token)throw new Error('chýba GitHub token');
 const base=`https://api.github.com/repos/${g.owner}/${g.repo}/contents/kv/`;
 const H={'Authorization':'Bearer '+g.token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
 const fn=k=>encodeURIComponent(k.replace(/:/g,'__'))+'.json';
 const dec=b=>decodeURIComponent(escape(atob(String(b).replace(/\n/g,''))));const enc=t=>btoa(unescape(encodeURIComponent(t)));
 const getFile=async k=>{const r=await fetch(base+fn(k)+'?ts='+Date.now(),{headers:H,cache:'no-store'});if(r.status===404)return null;if(!r.ok)throw new Error(r.status===401?'zlý GitHub token':'GitHub '+r.status);const j=await r.json();return {sha:j.sha,value:dec(j.content)};};
 if(a==='ping'){const r=await fetch(`https://api.github.com/repos/${g.owner}/${g.repo}?ts=${Date.now()}`,{headers:H,cache:'no-store'});if(!r.ok)throw new Error(r.status===401?'zlý GitHub token':r.status===404?'repozitár nenájdený / token bez prístupu':'GitHub '+r.status);return {ok:true,auth:true,chat:false};}
 if(a==='get'){const f=await getFile(p.key);return {value:f?f.value:null};}
 if(a==='set'){for(let i=0;i<3;i++){const f=await getFile(p.key);const body={message:'update '+p.key,content:enc(p.value)};if(f)body.sha=f.sha;const r=await fetch(base+fn(p.key),{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},H),body:JSON.stringify(body)});if(r.ok)return {ok:true};if(r.status!==409&&r.status!==422)throw new Error('GitHub '+r.status);await new Promise(x=>setTimeout(x,400));}throw new Error('konflikt zápisu');}
 if(a==='del'){const f=await getFile(p.key);if(!f)return {ok:true};await fetch(base+fn(p.key),{method:'DELETE',headers:Object.assign({'Content-Type':'application/json'},H),body:JSON.stringify({message:'delete '+p.key,sha:f.sha})});return {ok:true};}
 if(a==='list'||a==='getall'){const r=await fetch(base+'?ts='+Date.now(),{headers:H,cache:'no-store'});if(r.status===404)return a==='list'?{keys:[]}:{items:{}};if(!r.ok)throw new Error('GitHub '+r.status);const arr=await r.json();const keys=(Array.isArray(arr)?arr:[]).filter(x=>x.name.endsWith('.json')).map(x=>decodeURIComponent(x.name.slice(0,-5)).replace(/__/g,':')).filter(k=>k.startsWith(p.prefix||''));if(a==='list')return {keys};const items={};await Promise.all(keys.map(async k=>{const f=await getFile(k);if(f)items[k]=f.value;}));return {items};}
 if(a==='chat')throw new Error('chat cez GitHub nejde – zadaj API kľúč v nastaveniach');
 throw new Error('neznáma akcia');
}
function gas(fn,...args){return new Promise((res,rej)=>{google.script.run.withSuccessHandler(res).withFailureHandler(e=>rej(new Error((e&&e.message)||String(e))))[fn](...args);});}
async function rpc(a,payload={}){
 if(GAS){try{const j=await gas('apiS',Object.assign({a},payload));if(j&&j.error)throw new Error(j.error);SRV.ok=true;return j;}catch(e){SRV.ok=false;throw e;}}
 if(SRV.gh){try{const j=await ghApi(a,payload);SRV.ok=true;return j;}catch(e){SRV.ok=false;throw e;}}
 const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),15000);
 try{
  const res=await fetch(SRV.url,{method:'POST',body:JSON.stringify(Object.assign({a,k:SRV.key},payload)),signal:ctl.signal,redirect:'follow'});
  const txt=await res.text();let j;try{j=JSON.parse(txt);}catch(e){throw new Error('server nevrátil JSON – skontroluj URL (musí končiť na /exec)');}
  if(j.error)throw new Error(j.error);SRV.ok=true;return j;
 }catch(e){SRV.ok=false;throw e;}finally{clearTimeout(t);}
}
const S={mode:'local',
 async get(k){
  if(window.storage){try{const r=await window.storage.get(k,true);if(r&&r.value!=null){this.mode='claude';const v=JSON.parse(r.value);LS.set(k,v);return v;}}catch(e){}return LS.get(k);}
  if(SRV.url){try{const j=await rpc('get',{key:k});this.mode='server';if(j.value!=null){const v=JSON.parse(j.value);LS.set(k,v);return v;}return null;}catch(e){return LS.get(k);}}
  return LS.get(k);},
 async set(k,v){LS.set(k,v);const s=JSON.stringify(v);
  if(window.storage){try{const r=await window.storage.set(k,s,true);if(r){this.mode='claude';return true;}}catch(e){}return false;}
  if(SRV.url){try{await rpc('set',{key:k,value:s});this.mode='server';return true;}catch(e){return false;}}
  return true;},
 async del(k){LS.del(k);if(window.storage){try{await window.storage.delete(k,true);}catch(e){}}if(SRV.url){try{await rpc('del',{key:k});}catch(e){}}},
 async list(prefix){
  if(window.storage){try{const r=await window.storage.list(prefix,true);if(r&&r.keys)return r.keys;}catch(e){}}
  if(SRV.url){try{const j=await rpc('list',{prefix});return j.keys||[];}catch(e){}}
  try{return Object.keys(localStorage).filter(x=>x.startsWith(prefix));}catch(e){return [];}},
 async getAll(prefix){
  if(SRV.url&&!window.storage){try{const j=await rpc('getall',{prefix});const out={};Object.entries(j.items||{}).forEach(([k,s])=>{try{out[k]=JSON.parse(s);LS.set(k,out[k]);}catch(e){}});this.mode='server';return out;}catch(e){}}
  const keys=await this.list(prefix);const out={};for(const k of keys){const v=await this.get(k);if(v)out[k]=v;}return out;}
};

function migrateLog(l){
 if(l.items)return l;
 const items=[];const order=(SESSIONS[l.session]&&SESSIONS[l.session].ex?sessionExercisesRaw(l.session):[]);
 const seen=new Set();
 const push=id=>{const sets=(l.ex||{})[id];if(!sets||seen.has(id))return;seen.add(id);items.push({id,nm:'',sets:sets.map((s,i)=>({w:+s[0]||0,r:+s[1]||0,d:i===3?1:0}))});};
 order.forEach(x=>push(x.id));Object.keys(l.ex||{}).forEach(push);
 return {id:l.id||uid(),date:l.date,session:l.session,note:l.note||'',items,u:l.u||0};
}
function sessionExercisesRaw(k){const s=SESSIONS[k];if(!s||!s.ex)return [];const core=s.core?[...s.core.std,...s.core.dia]:[];return [...s.ex,...core];}
function exName(item){return item.nm||(EX[item.id]?EX[item.id].n:item.id);}
function validSets(item){return (item.sets||[]).filter(s=>(+s.r||0)>0||(+s.w||0)>0);}
function weekOf(d,wk){return (d.checks[wk]||{});}
function doneIn(d,from,to,type){
 let done=0,skip=0;
 Object.entries(d.checks||{}).forEach(([wk,bl])=>Object.entries(bl).forEach(([k,v])=>{
  const b=BLOCKS.find(x=>x.k===k)||{t:k.startsWith('X')?(v.t||'sila'):'sila'};
  const t=v.t||b.t;if(type&&t!==type)return;
  if(v.d>=from&&v.d<=to){if(v.s==='done')done++;else if(v.s==='skip')skip++;}
 }));
 return {done,skip};
}
function streakWeeks(d){
 let n=0;let wk=monday(today());
 const cnt=w=>Object.entries(weekOf(d,w)).filter(([k,v])=>v.s==='done'&&(v.t||(BLOCKS.find(x=>x.k===k)||{}).t)==='sila').length;
 if(cnt(wk)<3)wk=addDays(wk,-7);
 while(cnt(wk)>=3){n++;wk=addDays(wk,-7);if(n>200)break;}
 return n;
}
function exHistory(d,exId){ // [{d,e1,w,r,ton,bw}]
 const out=[];(d.logs||[]).forEach(l=>{(l.items||[]).forEach(it=>{if(it.id!==exId)return;let best=0,bw=0,br=0,ton=0,reps=0;validSets(it).forEach(s=>{const w=+s.w||0,r=+s.r||0;ton+=w*r;reps+=r;if(w>0&&r>0){const e=e1rm(w,r);if(e>best){best=e;bw=w;br=r;}}else if(w===0&&r>br){br=r;}});if(best>0||reps>0)out.push({d:l.date,e1:best,w:bw,r:br,ton,bw:best===0});});});
 return out.sort((a,b)=>a.d<b.d?-1:1);
}
function strengthGain(d){let sum=0,n=0;Object.keys(EX).forEach(id=>{const h=exHistory(d,id).filter(x=>x.e1>0);if(h.length>=2){sum+=(h[h.length-1].e1/h[0].e1-1)*100;n++;}});return n?sum/n:0;}
function logTonnage(l){let t=0;(l.items||[]).forEach(it=>validSets(it).forEach(s=>{t+=(+s.w||0)*(+s.r||0);}));return t;}
function estTonnage30(d){
 const from=addDays(today(),-29);let t=0;const last={};
 (d.logs||[]).slice().sort((a,b)=>a.date<b.date?-1:1).forEach(l=>last[l.session]=logTonnage(l));
 const vals=Object.values(last);const avg=vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:0;
 Object.values(d.checks||{}).forEach(bl=>Object.entries(bl).forEach(([k,v])=>{if(v.s==='done'&&v.d>=from&&(v.t||(BLOCKS.find(x=>x.k===k)||{}).t)==='sila'){const ses=v.ses||k;t+=last[ses]||avg;}}));
 return t;
}
function recentPRs(d,days=14){ // nové osobné rekordy e1RM za posledných N dní
 const from=addDays(today(),-days);const prs=[];
 Object.keys(EX).forEach(id=>{const h=exHistory(d,id).filter(x=>x.e1>0);if(h.length<2)return;const last=h[h.length-1];if(last.d<from)return;const prev=Math.max(...h.slice(0,-1).map(x=>x.e1));if(last.e1>prev*1.01)prs.push({id,n:EX[id].n,w:last.w,r:last.r,e1:last.e1,d:last.d,gain:(last.e1/prev-1)*100});});
 return prs.sort((a,b)=>b.gain-a.gain);
}
function healthAvg(d,days,key){const from=addDays(today(),-days+1);let s=0,n=0;Object.entries(d.health||{}).forEach(([day,h])=>{if(day>=from&&h[key]!=null&&!isNaN(h[key])){s+=+h[key];n++;}});return n?s/n:null;}
function foodAvg(d,days){const from=addDays(today(),-days+1);let s=0,n=0;for(let i=0;i<days;i++){const day=addDays(from,i);if(day>today())break;n++;s+=((d.food||{})[day]||[]).length/FOODCHK.length;}return n?s/n*100:0;}
function latestBw(p,d){const b=(d.body||[]).slice().sort((a,b)=>a.d<b.d?-1:1);const hw=Object.entries(d.health||{}).filter(([,h])=>h.w).sort((a,b)=>a[0]<b[0]?-1:1);const cands=[];if(b.length)cands.push([b[b.length-1].d,b[b.length-1].w]);if(hw.length)cands.push([hw[hw.length-1][0],hw[hw.length-1][1].w]);cands.sort((a,b)=>a[0]<b[0]?1:-1);return cands.length?cands[0][1]:(p.bw||0);}
function scoreFor(p,d){
 const from30=addDays(today(),-29),t=today();
 const s=doneIn(d,from30,t,'sila'),c=doneIn(d,from30,t,'kardio');
 const cons=(s.done+s.skip)?Math.round(s.done/(s.done+s.skip)*100):0;
 const gain=strengthGain(d),streak=streakWeeks(d),food=foodAvg(d,7);
 const pts=Math.round(s.done*10+c.done*4+cons/5+Math.max(0,gain)*2+streak*5+food/10);
 return {sila:s.done,kardio:c.done,cons,gain,streak,food,pts,skip:s.skip};
}
/* ciele stravy podľa profilu (váha, výška, vek, cieľ) */
function kcalTarget(p,bw){if(!bw||!p.h||!p.age)return null;const bmr=10*bw+6.25*p.h-5*p.age+(p.sex==='f'?-161:5);const adj={cut:.8,recomp:.9,bulk:1.1,maintain:1}[p.goal]||1;return Math.round(bmr*1.55*adj/10)*10;}
function targets(p,bw){
 const kcal=kcalTarget(p,bw);const pk=p.goal==='cut'||p.goal==='recomp'?2.0:1.8;
 const prot=bw?Math.round(bw*pk):null;const fat=bw?Math.round(bw*0.9):null;
 const carb=(kcal&&prot&&fat)?Math.max(80,Math.round((kcal-prot*4-fat*9)/4)):null;
 return {kcal,p:prot,f:fat,c:carb,fi:30,water:bw?r1(bw*.033):null,pk};
}
function mealTotals(day){const tot={kcal:0,p:0,c:0,f:0,fi:0};(D.meals||[]).filter(m=>m.d===day).forEach(m=>{const t=m.tot||{};['kcal','p','c','f','fi'].forEach(k=>tot[k]+=+t[k]||0);});return tot;}
function mealsAvg(days){const from=addDays(today(),-days+1);const tot={kcal:0,p:0,c:0,f:0,fi:0};let n=0;for(let i=0;i<days;i++){const day=addDays(from,i);if(day>today())break;const ms=(D.meals||[]).filter(m=>m.d===day);if(!ms.length)continue;n++;ms.forEach(m=>{const t=m.tot||{};['kcal','p','c','f','fi'].forEach(k=>tot[k]+=+t[k]||0);});}if(!n)return null;Object.keys(tot).forEach(k=>tot[k]=Math.round(tot[k]/n));tot.days=n;return tot;}

function ring(pct,color,val,sub,label){const r=38,c=2*Math.PI*r,off=c*(1-clamp(pct,0,1));return `<div class="ring"><svg viewBox="0 0 92 92"><circle class="bg" cx="46" cy="46" r="${r}" stroke-width="9"/><circle class="fg" cx="46" cy="46" r="${r}" stroke-width="9" stroke="${color}" stroke-dasharray="${c}" stroke-dashoffset="${c}" data-off="${off}"/></svg><div class="v">${val}<small>${sub}</small></div><div class="l">${label}</div></div>`;}
function animRings(){document.querySelectorAll('circle.fg[data-off]').forEach(el=>requestAnimationFrame(()=>requestAnimationFrame(()=>el.setAttribute('stroke-dashoffset',el.dataset.off))));}
function lineChart(o){
 const W=o.w||340,H=o.h||160,L=36,R=10,T=10,B=22;
 let xs=[],ys=[];(o.series||[]).forEach(s=>s.pts.forEach(p=>{xs.push(p[0]);ys.push(p[1]);}));
 if(o.band){o.band.lo.forEach(p=>{xs.push(p[0]);ys.push(p[1]);});o.band.hi.forEach(p=>{xs.push(p[0]);ys.push(p[1]);});}
 if(!xs.length)return `<div class="empty">Zatiaľ žiadne dáta.</div>`;
 let x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
 if(o.x0!=null)x0=o.x0;if(o.x1!=null)x1=o.x1;if(x1===x0)x1=x0+1;if(y1===y0){y1=y0+1;y0=y0-1;}const py=(y1-y0)*.12;y0-=py;y1+=py;
 const X=x=>L+(x-x0)/(x1-x0)*(W-L-R),Y=y=>T+(1-(y-y0)/(y1-y0))*(H-T-B);
 let g='';for(let i=0;i<=3;i++){const yv=y0+(y1-y0)*i/3;g+=`<line x1="${L}" x2="${W-R}" y1="${Y(yv)}" y2="${Y(yv)}" stroke="#262D36" stroke-width="1"/><text x="${L-4}" y="${Y(yv)+3}" text-anchor="end">${(o.yfmt||(v=>Math.round(v)))(yv)}</text>`;}
 (o.xl||[]).forEach(([x,l])=>{const xx=X(x);g+=`<text x="${xx}" y="${H-6}" text-anchor="${xx>W-28?'end':xx<L+14?'start':'middle'}">${esc(l)}</text>`;});
 let b='';if(o.band&&o.band.lo.length>1){const up=o.band.hi.map(p=>`${X(p[0])},${Y(p[1])}`).join(' ');const lo=o.band.lo.slice().reverse().map(p=>`${X(p[0])},${Y(p[1])}`).join(' ');b=`<polygon points="${up} ${lo}" fill="${o.band.color||'#5B8CFF'}" opacity=".14"/>`;}
 let s='';(o.series||[]).forEach(se=>{if(!se.pts.length)return;const d=se.pts.map((p,i)=>`${i?'L':'M'}${X(p[0])},${Y(p[1])}`).join(' ');s+=`<path d="${d}" fill="none" stroke="${se.color}" stroke-width="${se.width||2.5}" ${se.dash?`stroke-dasharray="${se.dash}"`:''} stroke-linecap="round" stroke-linejoin="round"/>`;if(se.dots)se.pts.forEach(p=>{s+=`<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="4" fill="${se.color}" stroke="#181D23" stroke-width="2"/>`;});});
 return `<svg class="chart" viewBox="0 0 ${W} ${H}">${g}${b}${s}</svg>`;
}
function barChart(vals,labels,color,max){
 const W=340,H=130,L=8,B=20,n=vals.length,gap=6,bw=(W-L*2-gap*(n-1))/n;const mx=max||Math.max(1,...vals);
 let s='';vals.forEach((v,i)=>{const h=(v/mx)*(H-B-14);const x=L+i*(bw+gap);s+=`<rect x="${x}" y="${H-B-h}" width="${bw}" height="${Math.max(h,2)}" rx="5" fill="${v?color:'#262D36'}"/><text x="${x+bw/2}" y="${H-B-h-4}" text-anchor="middle">${v||''}</text><text x="${x+bw/2}" y="${H-5}" text-anchor="middle">${esc(labels[i])}</text>`;});
 return `<svg class="chart" viewBox="0 0 ${W} ${H}">${s}</svg>`;
}

function projStrength(base,baseDate,exp,date){const m=Math.max(0,daysBetween(baseDate,date)/30.4);const R=RATE[exp]||RATE['0-1'];let o=base,p=base;const full=Math.floor(m),f=m-full;for(let i=0;i<full;i++){const k=Math.pow(.95,i);o*=1+R.o*k;p*=1+R.p*k;}const k=Math.pow(.95,full);o*=1+R.o*k*f;p*=1+R.p*k*f;return {o,p};}
function projBody(base,baseDate,goal,date){const w=Math.max(0,daysBetween(baseDate,date)/7);const R=BODYRATE[goal]||BODYRATE.maintain;return {o:base+R.o*w,p:base+R.p*w};}
function bodyHistory(p,d){const m={};(d.body||[]).forEach(b=>m[b.d]=b.w);Object.entries(d.health||{}).forEach(([day,h])=>{if(h.w&&!m[day])m[day]=h.w;});return Object.entries(m).sort((a,b)=>a[0]<b[0]?-1:1).map(([d,w])=>({d,w:+w}));}
function stageOf(ratio,m){let s=0;m.forEach((t,i)=>{if(ratio>=t)s=i;});return ratio<m[0]?-1:s;}

 const t=today();let lastD=null,lastName='';
 Object.values(D.checks||{}).forEach(bl=>Object.entries(bl).forEach(([k,v])=>{if(v.s==='done'&&(v.t||(BLOCKS.find(x=>x.k===k)||{}).t)==='sila'&&(!lastD||v.d>lastD)){lastD=v.d;lastName=(BLOCKS.find(x=>x.k===k)||{n:v.n||'tréning'}).n;}}));

 const next=BLOCKS.find(b=>b.t==='sila'&&!w[b.k]);const prs=recentPRs(D,10);const sl=healthAvg(D,7,'sleep');

}
function credoFallback(){
 const c=credoCtx();const grp=CREDO.find(g=>{try{return g.c(c);}catch(e){return false;}})||CREDO[CREDO.length-1];
 let h=0;const key=today()+ME.id;for(let i=0;i<key.length;i++)h=(h*31+key.charCodeAt(i))>>>0;
 const tpl=grp.t[h%grp.t.length];
 return tpl.replace(/\{(\w+)\}/g,(m,k)=>c[k]!=null?String(c[k]):'');
}

function attachSwipe(el){
 const top=el.querySelector('.top'),under=el.querySelector('.under'),L=under.querySelector('.l'),R=under.querySelector('.r');
 let x0=0,y0=0,dx=0,dir=null,active=false,buzzed=false;

 el.addEventListener('pointermove',e=>{
  if(!active)return;const mx=e.clientX-x0,my=e.clientY-y0;
  if(!dir){if(Math.abs(mx)>8||Math.abs(my)>8){dir=Math.abs(mx)>Math.abs(my)?'h':'v';if(dir==='h'){el.classList.add('drag');try{el.setPointerCapture(e.pointerId);}catch(err){}}else{active=false;return;}}else return;}
  if(dir!=='h')return;dx=mx;const w=el.offsetWidth,p=clamp(Math.abs(dx)/(w*.35),0,1);

 });

/* ---------- drag & drop poradie (prst na ☰) ---------- */
function makeSortable(container,itemSel,handleSel,onReorder){
 if(container._sortable)return;container._sortable=true;
 let dragEl=null,ghost=null;const pan=container.closest('.pan')||$('main');
 const move=e=>{if(!ghost)return;ghost.style.top=(e.clientY-22)+'px';const items=[...container.querySelectorAll(itemSel)].filter(x=>x!==dragEl);for(const it of items){const r=it.getBoundingClientRect();if(e.clientY<r.top+r.height/2){if(it.previousElementSibling!==dragEl)container.insertBefore(dragEl,it);return;}}if(container.lastElementChild!==dragEl)container.appendChild(dragEl);
  const pr=pan.getBoundingClientRect();if(e.clientY<pr.top+60)pan.scrollTop-=10;else if(e.clientY>pr.bottom-60)pan.scrollTop+=10;};
 container.addEventListener('pointerdown',e=>{const h=e.target.closest(handleSel);if(!h||h.hidden)return;const it=h.closest(itemSel);if(!it)return;dragEl=it;it.classList.add('dragging');try{h.setPointerCapture(e.pointerId);}catch(err){}ghost=document.createElement('div');ghost.className='dragghost';ghost.textContent=it.dataset.label||'';document.body.appendChild(ghost);move(e);e.preventDefault();buzz(8);});
 container.addEventListener('pointermove',e=>{if(dragEl)move(e);});
 const end=()=>{if(!dragEl)return;dragEl.classList.remove('dragging');dragEl=null;if(ghost)ghost.remove();ghost=null;onReorder([...container.querySelectorAll(itemSel)].map(x=>x.dataset.key));};
 container.addEventListener('pointerup',end);container.addEventListener('pointercancel',end);
}

let LOG=null,logSaveT=null;
function newLogFor(ses,date){
 const last=(D.logs||[]).filter(x=>x.session===ses&&x.id!==(LOG&&LOG.id)).sort((a,b)=>a.date<b.date?1:-1)[0];
 const items=sessionExercises(ses).map(x=>{const prev=last?(last.items||[]).find(i=>i.id===x.id):null;const sets=prev&&validSets(prev).length?prev.sets.map(s=>({w:+s.w||0,r:+s.r||0,d:s.d?1:0})):[{w:0,r:0,d:0},{w:0,r:0,d:0}];return {id:x.id,nm:'',sets};});
 return {id:uid(),date,session:ses,note:'',items,u:0};
}
function openLog(sesOrId){
 let l=null,ses='UA';
 if(sesOrId&&SESSIONS[sesOrId]&&SESSIONS[sesOrId].ex){ses=sesOrId;l=(D.logs||[]).find(x=>x.session===ses&&x.date===today())||null;}
 else if(sesOrId){l=(D.logs||[]).find(x=>x.id===sesOrId)||null;if(l)ses=l.session;}
 LOG=l?migrateLog(l):newLogFor(ses,today());
 renderLogEditor();openSheet('shLog');
}
function logHasContent(){return (LOG.items||[]).some(it=>validSets(it).length)||!!(LOG.note&&LOG.note.trim());}

 clearTimeout(logSaveT);const st=$('logState');st.textContent='ukladám…';st.className='savestate';
 logSaveT=setTimeout(()=>{
  const idx=D.logs.findIndex(x=>x.id===LOG.id);
  if(logHasContent()){LOG.u=Date.now();if(idx<0)D.logs.push(LOG);else D.logs[idx]=LOG;}
  else if(idx>=0)D.logs.splice(idx,1);

  const ll=$('loglist');if(ll)ll.innerHTML=histHTML();$('tab-train').querySelectorAll('[data-openlog]').forEach(b=>b.onclick=()=>openLog(b.dataset.openlog));

let idb=null;
function idbOpen(){return new Promise(res=>{try{const rq=indexedDB.open('ctp-foto',1);rq.onupgradeneeded=e=>{e.target.result.createObjectStore('p',{keyPath:'id'});};rq.onsuccess=e=>res(e.target.result);rq.onerror=()=>res(null);}catch(e){res(null);}});}
function idbGet(id){return new Promise(res=>{if(!idb)return res(null);try{const tx=idb.transaction('p','readonly').objectStore('p').get(id);tx.onsuccess=()=>res(tx.result||null);tx.onerror=()=>res(null);}catch(e){res(null);}});}
function idbPut(o){return new Promise(res=>{if(!idb)return res(false);try{const tx=idb.transaction('p','readwrite').objectStore('p').put(o);tx.onsuccess=()=>res(true);tx.onerror=()=>res(false);}catch(e){res(false);}});}
function idbDel(id){return new Promise(res=>{if(!idb)return res(false);try{const tx=idb.transaction('p','readwrite').objectStore('p').delete(id);tx.onsuccess=()=>res(true);tx.onerror=()=>res(false);}catch(e){res(false);}});}
function thumbOf(dataUrl,size=96){return new Promise(res=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=size;c.height=size;const x=c.getContext('2d');const k=Math.max(size/img.width,size/img.height);const w=img.width*k,h=img.height*k;x.drawImage(img,(size-w)/2,(size-h)/2,w,h);res(c.toDataURL('image/jpeg',.6));};img.onerror=()=>res('');img.src=dataUrl;});}

function itemRowHTML(it,i){return `<div class="itemrow" data-i="${i}"><input value="${esc(it.n||'')}" placeholder="názov" data-k="n"><input class="g" type="number" inputmode="decimal" value="${it.g||''}" placeholder="g" data-k="g"><input class="k" type="number" inputmode="decimal" value="${it.kcal||''}" placeholder="kcal" data-k="kcal"><input class="p" type="number" inputmode="decimal" value="${it.p||''}" placeholder="B" data-k="p"></div>`;}

async function analyzePending(status){
 const list=(D.meals||[]).filter(m=>m.ai==='pending').sort((a,b)=>a.d<b.d?-1:1).slice(0,12);let n=0;
 for(const m of list){if(status)status(`${n+1}/${list.length}…`);try{await analyzeMeal(m);m.ai='done';m.u=Date.now();n++;save();}catch(e){m.ai='error';m.aiNote='Analýza zlyhala: '+(e.message||e);save();}}
 return n;
}

function nutriScore(m){if(!m||!m.kcal)return 0;const pd=(m.p||0)*4/m.kcal;return Math.round(clamp(pd,0,.6)/.6*60+clamp(m.fi||0,0,15)/15*40);}

function parseCSV(text){
 const lines=text.replace(/\r/g,'').split('\n').filter(l=>l.trim());if(!lines.length)return {h:[],rows:[]};
 const delim=(lines[0].match(/;/g)||[]).length>(lines[0].match(/,/g)||[]).length?';':',';
 const split=l=>{const out=[];let cur='',q=false;for(let i=0;i<l.length;i++){const c=l[i];if(c==='"'){if(q&&l[i+1]==='"'){cur+='"';i++;}else q=!q;}else if(c===delim&&!q){out.push(cur);cur='';}else cur+=c;}out.push(cur);return out.map(x=>x.trim());};
 return {h:split(lines[0]).map(x=>x.replace(/^\uFEFF/,'')),rows:lines.slice(1).map(split)};
}
function findCol(h,res){const hl=h.map(x=>x.toLowerCase());for(const re of res){const i=hl.findIndex(x=>re.test(x));if(i>=0)return i;}return -1;}

function toMin(v){if(v==null||v==='')return null;v=String(v).trim();let m;if((m=v.match(/^(\d+):(\d{2})(?::(\d{2}))?$/)))return +m[1]*60+ +m[2]+(m[3]?+m[3]/60:0);if((m=v.match(/(\d+)\s*h(?:\s*(\d+)\s*m)?/i)))return +m[1]*60+(m[2]?+m[2]:0);const n=parseFloat(v.replace(',','.'));if(isNaN(n))return null;if(n>1000)return n/60;if(n>30)return n;return n*60;}
function num(v){if(v==null)return null;const n=parseFloat(String(v).replace(/\s/g,'').replace(',','.'));return isNaN(n)?null:n;}
function importCSV(text){
 const {h,rows}=parseCSV(text);if(!h.length)throw new Error('prázdny súbor');
 const c={date:findCol(h,[/^date$/,/^day$/,/^dátum|^datum/,/calendar/,/^timestamp/,/date/]),steps:findCol(h,[/^steps$/,/steps/,/kroky/]),rhr:findCol(h,[/resting heart/,/lowest resting/,/resting hr/,/^rhr/,/kľud/]),hrv:findCol(h,[/average hrv/,/^hrv/,/hrv/]),sleep:findCol(h,[/total sleep/,/sleep duration/,/sleep time/,/time asleep/,/asleep/,/^sleep$/,/spánok/]),sscore:findCol(h,[/sleep score/]),ready:findCol(h,[/readiness score/,/readiness/,/body battery/]),kcal:findCol(h,[/active calories/,/active energy/,/total calories/,/calories/,/kalóri/]),w:findCol(h,[/^weight/,/body weight/,/body mass/,/hmotnos/,/váha/]),atype:findCol(h,[/activity type/,/^type$/]),dur:findCol(h,[/^time$/,/^duration/,/elapsed/,/moving time/])};
 if(c.date<0)throw new Error('nenašiel som stĺpec s dátumom (hlavička: '+h.slice(0,6).join(', ')+'…)');
 D.health=D.health||{};const fields=new Set();let days=0;
 rows.forEach(r=>{const d=normDate(r[c.date]);if(!d)return;const o=D.health[d]||{};let any=false;
  const put=(k,v)=>{if(v!=null&&!isNaN(v)){o[k]=v;fields.add(k);any=true;}};
  if(c.steps>=0)put('steps',num(r[c.steps]));if(c.rhr>=0)put('rhr',num(r[c.rhr]));if(c.hrv>=0)put('hrv',num(r[c.hrv]));if(c.sleep>=0)put('sleep',toMin(r[c.sleep]));if(c.sscore>=0)put('sscore',num(r[c.sscore]));if(c.ready>=0)put('ready',num(r[c.ready]));if(c.kcal>=0)put('kcal',num(r[c.kcal]));if(c.w>=0){const w=num(r[c.w]);if(w>25&&w<300)put('w',w);}
